[package]
  name = "rust_lib_watchtower"
  version = "0.1.0"
  edition = "2021"

  [lib]
  crate-type = ["cdylib", "staticlib"]

  [dependencies]
  flutter_rust_bridge = { version = "=2.11.1", features = ["chrono"] }
  image = "0.25.10"
  chrono = "0.4.44"
  futures-util = "0.3.31"
  reqwest = { version = "0.13.2", default-features = false, features = ["charset", "http2", "rustls", "stream", "multipart", "socks", "brotli", "gzip"] }
  # Direct rustls + webpki-roots so we can call use_preconfigured_tls() with a
  # Mozilla CA bundle.  This bypasses rustls-platform-verifier entirely — it panics
  # on Android without JNI initialisation and is not available on iOS/TrollStore.
  rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
  webpki-roots = "0.26"
  tokio = { version = "1.50.0", features = ["full"] }
  tokio-util = "0.7.16"
  epub = "2.1.5"
  zip = "8.5.0"
  