name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust (rust_lib_watchtower FFI via cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods spec repo
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-repo-${{ runner.os }}-v1
          restore-keys: cocoapods-repo-${{ runner.os }}-

      - name: Cache ios/Pods
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix flutter_new_pipe_extractor missing assets dir
        run: |
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
            echo "Created: $dir/assets"
          done

      - name: Regenerate app icons (flutter_launcher_icons)
        run: dart run flutter_launcher_icons:main

      - name: Install CocoaPods
        run: |
          cd ios
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Pods cache hit — pod install"
            pod install
          else
            echo "Pods cache miss — pod install --repo-update"
            pod install --repo-update
          fi

      - name: Patch Xcode project for CI (manual signing, no team)
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9][A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;/PROVISIONING_PROFILE = "";/g' "$PBXPROJ"
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING" "$PBXPROJ" | sort -u || true

      - name: Build iOS (no codesign)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found at $APP"
            find build -name "Runner.app" -type d 2>/dev/null | head -5 || true
            exit 1
          fi
          echo "=== App size: $(du -sh $APP) ==="

      - name: Prepare IPA bundle (TrollStore-compatible)
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"

          echo "=== Removing _CodeSignature dirs ==="
          find "$APP" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== Removing .car files (BOMStore — ldid Unknown header magic) ==="
          find "$APP" -name "*.car" -delete 2>/dev/null || true

          echo "=== Removing .metallib files (Metal shader — ldid Unknown header magic) ==="
          find "$APP" -name "*.metallib" -delete 2>/dev/null || true

          echo "=== Removing .storyboardc dirs ==="
          find "$APP" -name "*.storyboardc" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== Removing orphan .nib files ==="
          find "$APP" -name "*.nib" -delete 2>/dev/null || true

          echo "=== Removing icudtl.dat (ICU data binary — magic 9000da27 — ldid Unknown header magic) ==="
          # Flutter on iOS uses system ICU (Foundation.framework); icudtl.dat is not loaded at runtime
          find "$APP" -name "icudtl.dat" -delete 2>/dev/null || true

          echo "=== Removing Impeller precompiled shaders (.frag — IPLR binary — ldid Unknown header magic) ==="
          # Flutter falls back to JIT shader compilation at runtime; no functional impact
          find "$APP" -name "*.frag" -delete 2>/dev/null || true

          echo "=== Removing .ldid.* residuals ==="
          find "$APP" -name ".ldid.*" -delete 2>/dev/null || true

          echo "=== Bundle size after cleanup: $(du -sh "$APP" | cut -f1) ==="

          echo "=== Non-Mach-O binary audit (files at framework roots that ldid will touch) ==="
          for fw in "$APP"/Frameworks/*.framework; do
            fname=$(basename "$fw" .framework)
            find "$fw" -maxdepth 1 -type f | while read f; do
              bname=$(basename "$f")
              magic=$(xxd -l 4 "$f" 2>/dev/null | awk '{print $2$3}' || od -A n -t x1 -N 4 "$f" 2>/dev/null | tr -d ' \n')
              case "$magic" in
                cafebabe|cefaedfe|cffaedfe|feedface|feedfacf|bebafeca)
                  echo "  OK   Mach-O:  $fname/$bname";;
                62706c69|3c3f786d|3c3f786d)
                  echo "  OK   plist:   $fname/$bname";;
                89504e47|ffd8ffe0|ffd8ffe1|ffd8ffdb)
                  echo "  OK   image:   $fname/$bname";;
                *)
                  echo "  WARN unknown: $fname/$bname  magic=$magic";;
              esac
            done
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS.ipa Payload/
          rm -rf Payload
          echo "=== IPA: $(du -sh Watchtower-iOS.ipa | cut -f1) ==="

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-ios-ipa
          path: Watchtower-iOS.ipa
          compression-level: 0
          retention-days: 30

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "Watchtower iOS (TrollStore)"
          prerelease: true
          files: Watchtower-iOS.ipa
          body: IPA pour TrollStore (iPhone 7 / iOS 15+). Build auto depuis main.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify ntfy (build OK)
        if: success()
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build iOS OK" \
            -H "Priority: default" \
            -d "IPA built & released — sha ${{ github.sha }} — ${{ github.event.head_commit.message }}" || true
