name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

# Cancel in-progress runs on new push — only the latest commit matters
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust (rust_lib_watchtower FFI via cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ── CocoaPods: two-layer cache ─────────────────────────────────────────
      # Layer 1: spec repo (~/.cocoapods) — avoids full clone on cold cache.
      # Layer 2: resolved Pods dir (ios/Pods) — keyed by Podfile; on hit,
      #          pod install is near-instant (just a verification pass).
      - name: Cache CocoaPods spec repo
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-repo-${{ runner.os }}-v1
          restore-keys: cocoapods-repo-${{ runner.os }}-

      - name: Cache ios/Pods
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix flutter_new_pipe_extractor missing assets dir
        run: |
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
            echo "Created: $dir/assets"
          done

      - name: Regenerate app icons (flutter_launcher_icons)
        run: dart run flutter_launcher_icons:main

      - name: Install CocoaPods
        run: |
          cd ios
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            # Pods directory restored from cache — fast verification pass only
            echo "Pods cache hit — running pod install (no repo-update)"
            pod install
          else
            # Cold cache — full resolve + update spec repo
            echo "Pods cache miss — running pod install --repo-update"
            pod install --repo-update
          fi

      # ── Patch Xcode ─────────────────────────────────────────────────────────
      # CODE_SIGN_STYLE=Automatic sans DEVELOPMENT_TEAM fait échouer le build.
      # On passe en Manual + identité vide → --no-codesign fonctionne.
      - name: Patch Xcode project for CI (manual signing, no team)
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9][A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;/PROVISIONING_PROFILE = "";/g' "$PBXPROJ"
          echo "=== CODE_SIGN après patch ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING" "$PBXPROJ" | sort -u || true

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build iOS (no codesign)
        run: |
          set -euo pipefail

          # Phase 1: générer le glue Flutter (xcconfig, GeneratedPluginRegistrant, etc.)
          flutter build ios --release --no-codesign --config-only 2>&1 | tail -20 || true

          # Phase 2: xcodebuild avec signing totalement désactivé.
          echo "=== xcodebuild start ==="
          set +e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee /tmp/xbuild.log
          XB_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $XB_EXIT -ne 0 ]; then
            echo "=== xcodebuild FAILED (exit $XB_EXIT) — last 60 lines ==="
            tail -60 /tmp/xbuild.log
            exit $XB_EXIT
          fi
          echo "=== xcodebuild SUCCESS ==="

          APP="build/ios/iphoneos/Runner.app"
          echo "=== App size: $(du -sh $APP) ==="

          echo "=== Vérification entitlements ==="
          ldid -e "$APP/Runner" 2>/dev/null | head -20 || true

          echo "=== Frameworks signes ==="
          ls "$APP/Frameworks/" 2>/dev/null | wc -l || echo "0"

          echo "=== Ad-hoc codesign (requis TrollStore) ==="
          codesign --force --sign - --deep "$APP" 2>/dev/null || true
          codesign -dvvv "$APP" 2>&1 | head -8 || true

      # ── Cleanup .ldid.* residus ─────────────────────────────────────────────
      - name: Cleanup ldid residual files
        run: |
          APP="build/ios/iphoneos/Runner.app"
          COUNT=$(find "$APP" -name ".ldid.*" | wc -l)
          find "$APP" -name ".ldid.*" -delete
          echo "Cleaned $COUNT .ldid.* files"

      # ── Package IPA ─────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS.ipa Payload/
          rm -rf Payload
          IPA_SIZE=$(du -sh Watchtower-iOS.ipa | cut -f1)
          echo "=== IPA: $IPA_SIZE ==="
          echo "=== Frameworks dans IPA ==="
          unzip -l Watchtower-iOS.ipa | grep "Frameworks/.*.framework/$" | wc -l
          echo "=== Vérif wakelock_plus ==="
          unzip -l Watchtower-iOS.ipa | grep wakelock || echo "wakelock_plus: static (absent des Frameworks binaries) ✓"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-ios-ipa
          path: Watchtower-iOS.ipa
          compression-level: 0
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "Watchtower iOS (TrollStore)"
          prerelease: true
          files: Watchtower-iOS.ipa
          body: IPA pour TrollStore (iPhone 7 / iOS 15+). Build auto depuis main.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
