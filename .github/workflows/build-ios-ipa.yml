name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust (rust_lib_watchtower FFI via cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ── ZeusDL ──────────────────────────────────────────────────────────────
      # Télécharge le binaire iOS arm64. Si introuvable ou format inconnu →
      # on ne bundle RIEN (pas de stub) pour éviter que ldid plante.
      - name: Bundle ZeusDL iOS arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets/binaries
          DOWNLOADED=false

          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ferelking242/zeusdl/releases/latest" 2>/dev/null || echo '{}')
          ZEUSDL_VERSION=$(echo "$RELEASE_JSON" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo '')

          if [ -n "$ZEUSDL_VERSION" ]; then
            for ASSET in "zeusdl-ios-arm64" "zeusdl-ios" "yt-dlp_ios"; do
              URL="https://github.com/ferelking242/zeusdl/releases/download/${ZEUSDL_VERSION}/${ASSET}"
              echo "Trying: $URL"
              if curl -fsSL --max-time 60 "$URL" -o assets/binaries/zeusdl 2>/dev/null; then
                MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
                if [[ "$MAGIC" == "cffaedfe" || "$MAGIC" == "cefaedfe" || "$MAGIC" == "cafebabe" ]]; then
                  echo "OK: $(wc -c < assets/binaries/zeusdl) bytes magic=$MAGIC"
                  # Thin to arm64 immediately if fat
                  if [[ "$MAGIC" == "cafebabe" ]]; then
                    lipo assets/binaries/zeusdl -thin arm64 -output assets/binaries/zeusdl.thin 2>/dev/null \
                      && mv assets/binaries/zeusdl.thin assets/binaries/zeusdl \
                      && echo "zeusdl thinned to arm64" \
                      || rm -f assets/binaries/zeusdl
                  fi
                  DOWNLOADED=true; break
                else
                  rm -f assets/binaries/zeusdl
                fi
              fi
            done
          fi

          # Fallback: yt-dlp officiel
          if [ "$DOWNLOADED" = "false" ]; then
            YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_ios"
            if curl -fsSL --max-time 60 "$YTDLP_URL" -o assets/binaries/zeusdl 2>/dev/null; then
              MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
              if [[ "$MAGIC" == "cffaedfe" || "$MAGIC" == "cefaedfe" || "$MAGIC" == "cafebabe" ]]; then
                if [[ "$MAGIC" == "cafebabe" ]]; then
                  lipo assets/binaries/zeusdl -thin arm64 -output assets/binaries/zeusdl.thin 2>/dev/null \
                    && mv assets/binaries/zeusdl.thin assets/binaries/zeusdl \
                    || rm -f assets/binaries/zeusdl
                fi
                DOWNLOADED=true
                echo "yt-dlp iOS: $(wc -c < assets/binaries/zeusdl 2>/dev/null || echo 0) bytes"
              else
                rm -f assets/binaries/zeusdl
              fi
            fi
          fi

          if [ "$DOWNLOADED" = "false" ]; then
            # Pas de stub — on laisse le dossier vide, l'app gère l'absence
            echo "WARN: zeusdl introuvable — assets/binaries/ restera vide"
            ls -la assets/binaries/ || true
          fi

      - name: Patch pubspec.yaml pour assets/binaries/
        run: |
          if ! grep -q "assets/binaries/" pubspec.yaml; then
            sed -i '' 's|    - assets/icons/|    - assets/icons/\n    - assets/binaries/|' pubspec.yaml
          fi
          grep "assets/" pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate app icons (flutter_launcher_icons)
        run: dart run flutter_launcher_icons:main

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      # ── Patch Xcode ─────────────────────────────────────────────────────────
      # CODE_SIGN_STYLE=Automatic sans DEVELOPMENT_TEAM fait échouer le build.
      # On passe en Manual + identité vide → --no-codesign fonctionne.
      - name: Patch Xcode project for CI (manual signing, no team)
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9][A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          echo "=== CODE_SIGN après patch ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM" "$PBXPROJ" | sort -u

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign
          echo "=== Bundle size: $(du -sh build/ios/iphoneos/Runner.app/ | cut -f1) ==="
          echo "=== Frameworks count: $(ls build/ios/iphoneos/Runner.app/Frameworks/ | wc -l) ==="
          ls build/ios/iphoneos/Runner.app/flutter_assets/assets/binaries/ 2>/dev/null \
            && echo "zeusdl présent" || echo "zeusdl absent (OK)"

      # ── Prepare bundle for TrollStore ldid ──────────────────────────────────
      # TrollStore sur iPhone 7 utilise un vieux ldid qui :
      #   1. Ne comprend pas arm64e → thin FAT → arm64
      #   2. Ne comprend pas les archives statiques (ar) → remove du framework
      #   3. Choke sur fichiers non-Mach-O dans .framework → remove
      - name: Prepare bundle for TrollStore ldid compatibility
        run: |
          APP="build/ios/iphoneos/Runner.app"
          THINNED=0; ALREADY=0; REMOVED=0; SKIPPED=0

          for fw in "$APP/Frameworks"/*.framework; do
            NAME=$(basename "$fw" .framework)
            BIN="$fw/$NAME"
            [ -f "$BIN" ] || { SKIPPED=$((SKIPPED+1)); continue; }

            # file(1) ne nécessite pas xxd — identifie le type réel
            FILETYPE=$(file -b "$BIN")

            if echo "$FILETYPE" | grep -q "ar archive"; then
              # Archive statique (ex: wakelock_plus compilé staticlib)
              # Le code est déjà linké dans Runner → le .framework entier est inutile.
              # Si on supprime juste le binaire, ldid -s (TrollStore) tente quand même
              # d'ouvrir <framework>/<name> → DiskFolder::Open assert → erreur 175.
              # Solution : supprimer tout le dossier .framework.
              rm -rf "$fw"
              echo "REMOVED framework dir (static archive): $NAME"
              REMOVED=$((REMOVED+1))

            elif echo "$FILETYPE" | grep -q "Mach-O.*universal"; then
              # FAT binary — thin à arm64
              if lipo -info "$BIN" 2>/dev/null | grep -q "arm64"; then
                lipo "$BIN" -thin arm64 -output "${BIN}.thin" 2>/dev/null \
                  && mv "${BIN}.thin" "$BIN" \
                  && echo "THINNED: $NAME" \
                  && THINNED=$((THINNED+1)) \
                  || { echo "WARN: lipo failed $NAME"; SKIPPED=$((SKIPPED+1)); }
              else
                echo "WARN: $NAME fat sans slice arm64"
                SKIPPED=$((SKIPPED+1))
              fi

            elif echo "$FILETYPE" | grep -q "Mach-O"; then
              ALREADY=$((ALREADY+1))

            else
              # Autre format inconnu dans un .framework → supprimer
              echo "REMOVED unknown: $NAME ($FILETYPE)"
              rm -f "$BIN"
              REMOVED=$((REMOVED+1))
            fi
          done

          echo "=== Résultat: $THINNED thinned | $ALREADY arm64 OK | $REMOVED removed | $SKIPPED skip ==="

          # Zeusdl dans assets
          ZEUSDL="$APP/flutter_assets/assets/binaries/zeusdl"
          if [ -f "$ZEUSDL" ]; then
            ZTYPE=$(file -b "$ZEUSDL")
            echo "zeusdl type: $ZTYPE"
            if echo "$ZTYPE" | grep -q "Mach-O.*universal"; then
              lipo "$ZEUSDL" -thin arm64 -output "${ZEUSDL}.thin" 2>/dev/null \
                && mv "${ZEUSDL}.thin" "$ZEUSDL" && echo "zeusdl thinned" \
                || { rm -f "$ZEUSDL"; echo "zeusdl removed (lipo failed)"; }
            elif ! echo "$ZTYPE" | grep -q "Mach-O"; then
              rm -f "$ZEUSDL"
              echo "zeusdl removed (not Mach-O: $ZTYPE)"
            fi
          fi

      # ── Signer ──────────────────────────────────────────────────────────────
      # 1. ldid -S (sans entitlements) sur chaque framework → pré-signe
      # 2. ldid -S<ent> sur Runner → entitlements TrollStore
      # 3. codesign --force --sign - récursif → signature ad-hoc finale
      - name: Sign for TrollStore (ldid per-framework + codesign recursive)
        run: |
          APP="build/ios/iphoneos/Runner.app"
          ENT="ios/Runner/Runner.entitlements"
          brew install ldid 2>/dev/null || true

          echo "=== ldid par framework ==="
          for fw in "$APP/Frameworks"/*.framework; do
            NAME=$(basename "$fw" .framework)
            BIN="$fw/$NAME"
            if [ -f "$BIN" ]; then
              ldid -S "$BIN" 2>/dev/null && echo "ldid OK: $NAME" || echo "ldid SKIP: $NAME"
            fi
          done

          # Signer zeusdl si présent
          ZEUSDL="$APP/flutter_assets/assets/binaries/zeusdl"
          if [ -f "$ZEUSDL" ]; then
            ldid -S "$ZEUSDL" 2>/dev/null && echo "ldid zeusdl OK" || echo "WARN: ldid zeusdl skipped (déjà signé ou format PyInstaller) — binaire conservé"
          fi

          echo "=== ldid Runner avec entitlements ==="
          ldid -S"$ENT" "$APP/Runner" && echo "ldid Runner OK" || echo "WARN: ldid Runner failed"

          echo "=== codesign récursif ad-hoc ==="
          /usr/bin/codesign --force --deep --sign - \
            --entitlements "$ENT" --timestamp=none "$APP" \
            && echo "codesign OK" || echo "WARN: codesign failed"

          echo "=== Vérification entitlements ==="
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -20 || true

          echo "=== Frameworks présents ==="
          ls "$APP/Frameworks/" | wc -l
          echo "wakelock_plus binary: $([ -f "$APP/Frameworks/wakelock_plus.framework/wakelock_plus" ] && echo PRESENT || echo absent-static-OK)"

      # ── Cleanup .ldid.* residus ─────────────────────────────────────────────
      # ldid -S crée des fichiers .ldid.<name> dans chaque .framework
      # TrollStore les inclut dans son scan → "Unknown header magic"
      - name: Cleanup ldid residual files
        run: |
          APP="build/ios/iphoneos/Runner.app"
          COUNT=$(find "$APP" -name ".ldid.*" | wc -l)
          find "$APP" -name ".ldid.*" -delete
          echo "Cleaned $COUNT .ldid.* files"

      # ── Package IPA ─────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS.ipa Payload/
          rm -rf Payload
          IPA_SIZE=$(du -sh Watchtower-iOS.ipa | cut -f1)
          echo "=== IPA: $IPA_SIZE ==="
          echo "=== Frameworks dans IPA ==="
          unzip -l Watchtower-iOS.ipa | grep "Frameworks/.*.framework/$" | wc -l
          echo "=== Vérif wakelock_plus ==="
          unzip -l Watchtower-iOS.ipa | grep wakelock || echo "wakelock_plus: static (absent des Frameworks binaries) ✓"
          echo "=== Vérif zeusdl ==="
          unzip -l Watchtower-iOS.ipa | grep zeusdl && echo "zeusdl: présent ✓" || echo "WARN: zeusdl absent de l'IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Watchtower-iOS.ipa
          compression-level: 0
          retention-days: 30
