name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Flutter 3.38.x = Dart 3.10.x - go_router 17.x / riverpod 3.x necessitent Dart >= 3.10.
      # Le crash iOS 15 (SIGURG Go vs Dart VM) est resolu dans AppDelegate.swift via dlopen().
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Bundle ZeusDL iOS arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets/binaries
          DOWNLOADED=false
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ferelking242/zeusdl/releases/latest" 2>/dev/null || echo '{}')
          VER=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo '')
          if [ -n "$VER" ]; then
            for ASSET in "zeusdl-ios-arm64" "zeusdl-ios" "yt-dlp_ios"; do
              URL="https://github.com/ferelking242/zeusdl/releases/download/${VER}/${ASSET}"
              if curl -fsSL --max-time 60 "$URL" -o assets/binaries/zeusdl 2>/dev/null; then
                MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
                if [[ "$MAGIC" == "cffaedfe" || "$MAGIC" == "cefaedfe" || "$MAGIC" == "cafebabe" ]]; then
                  if [[ "$MAGIC" == "cafebabe" ]]; then
                    lipo assets/binaries/zeusdl -thin arm64 -output assets/binaries/zeusdl.thin 2>/dev/null \
                      && mv assets/binaries/zeusdl.thin assets/binaries/zeusdl \
                      || rm -f assets/binaries/zeusdl
                  fi
                  DOWNLOADED=true; break
                else
                  rm -f assets/binaries/zeusdl
                fi
              fi
            done
          fi
          if [ "$DOWNLOADED" = "false" ]; then
            YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_ios"
            if curl -fsSL --max-time 60 "$YTDLP_URL" -o assets/binaries/zeusdl 2>/dev/null; then
              MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
              if [[ "$MAGIC" == "cffaedfe" || "$MAGIC" == "cefaedfe" || "$MAGIC" == "cafebabe" ]]; then
                if [[ "$MAGIC" == "cafebabe" ]]; then
                  lipo assets/binaries/zeusdl -thin arm64 -output assets/binaries/zeusdl.thin 2>/dev/null \
                    && mv assets/binaries/zeusdl.thin assets/binaries/zeusdl \
                    || rm -f assets/binaries/zeusdl
                fi
                DOWNLOADED=true
              else
                rm -f assets/binaries/zeusdl
              fi
            fi
          fi
          if [ "$DOWNLOADED" = "false" ]; then
            echo "WARN: zeusdl introuvable"
          fi

      - name: Patch pubspec.yaml pour assets/binaries/
        run: |
          if ! grep -q "assets/binaries/" pubspec.yaml; then
            sed -i '' 's|    - assets/icons/|    - assets/icons/\n    - assets/binaries/|' pubspec.yaml
          fi

      - name: Remove stale Podfile.lock
        run: rm -f ios/Podfile.lock

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate app icons
        run: dart run flutter_launcher_icons:main

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      - name: Patch Xcode project for CI
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9][A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM" "$PBXPROJ" | sort -u

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign
          echo "Bundle: $(du -sh build/ios/iphoneos/Runner.app/ | cut -f1)"

      - name: Prepare bundle (thin ARM64, remove static archives)
        run: |
          APP="build/ios/iphoneos/Runner.app"
          for fw in "$APP/Frameworks"/*.framework; do
            NAME=$(basename "$fw" .framework); BIN="$fw/$NAME"
            [ -f "$BIN" ] || continue
            FILETYPE=$(file -b "$BIN")
            if echo "$FILETYPE" | grep -q "ar archive"; then
              rm -rf "$fw"; echo "REMOVED static: $NAME"
            elif echo "$FILETYPE" | grep -q "Mach-O.*universal"; then
              if lipo -info "$BIN" 2>/dev/null | grep -q "arm64"; then
                lipo "$BIN" -thin arm64 -output "${BIN}.t" 2>/dev/null \
                  && mv "${BIN}.t" "$BIN" && echo "THINNED: $NAME" \
                  || echo "SKIP thin: $NAME"
              fi
            fi
          done
          ZEUSDL="$APP/flutter_assets/assets/binaries/zeusdl"
          if [ -f "$ZEUSDL" ]; then
            ZTYPE=$(file -b "$ZEUSDL")
            if echo "$ZTYPE" | grep -q "Mach-O.*universal"; then
              lipo "$ZEUSDL" -thin arm64 -output "${ZEUSDL}.t" && mv "${ZEUSDL}.t" "$ZEUSDL" || rm -f "$ZEUSDL"
            elif ! echo "$ZTYPE" | grep -q "Mach-O"; then
              rm -f "$ZEUSDL"
            fi
          fi

      - name: Sign for TrollStore
        run: |
          APP="build/ios/iphoneos/Runner.app"
          ENT="ios/Runner/Runner.entitlements"
          brew install ldid 2>/dev/null || true
          for fw in "$APP/Frameworks"/*.framework; do
            NAME=$(basename "$fw" .framework); BIN="$fw/$NAME"
            [ -f "$BIN" ] && { ldid -S "$BIN" 2>/dev/null && echo "ldid: $NAME" || true; }
          done
          if [ -f "$ENT" ]; then ldid -S"$ENT" "$APP/Runner"; else ldid -S "$APP/Runner"; fi
          codesign --force --sign - --deep "$APP" 2>/dev/null || true
          codesign -dvvv "$APP" 2>&1 | head -8 || true

      - name: Create IPA
        run: |
          APP="build/ios/iphoneos/Runner.app"
          mkdir -p build/ios/iphoneos/Payload
          cp -r "$APP" build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r ../../Runner.ipa Payload/
          ls -lh build/Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-ios-ipa
          path: build/Runner.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "Watchtower iOS (TrollStore)"
          prerelease: true
          files: build/Runner.ipa
          body: IPA pour TrollStore (iPhone 7 / iOS 15+). Build auto depuis main.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
