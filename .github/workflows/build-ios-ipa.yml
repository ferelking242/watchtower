name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust (rust_lib_watchtower FFI via cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Bundle ZeusDL iOS arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets/binaries
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ferelking242/zeusdl/releases/latest" 2>/dev/null || echo '{}')
          ZEUSDL_VERSION=$(echo "$RELEASE_JSON" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo '')
          DOWNLOADED=false
          if [ -n "$ZEUSDL_VERSION" ]; then
            for ASSET in "zeusdl-ios-arm64" "zeusdl-ios" "yt-dlp_ios"; do
              URL="https://github.com/ferelking242/zeusdl/releases/download/${ZEUSDL_VERSION}/${ASSET}"
              echo "Trying: $URL"
              if curl -fsSL "$URL" -o assets/binaries/zeusdl 2>/dev/null; then
                MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
                if [[ "$MAGIC" == "cefaedfe" || "$MAGIC" == "cffaedfe" || "$MAGIC" == "cafebabe" ]]; then
                  echo "Mach-O OK: $(wc -c < assets/binaries/zeusdl) bytes"
                  DOWNLOADED=true; break
                else
                  rm -f assets/binaries/zeusdl
                fi
              fi
            done
          fi
          if [ "$DOWNLOADED" = "false" ]; then
            YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_ios"
            if curl -fsSL "$YTDLP_URL" -o assets/binaries/zeusdl 2>/dev/null; then
              MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
              if [[ "$MAGIC" == "cefaedfe" || "$MAGIC" == "cffaedfe" || "$MAGIC" == "cafebabe" ]]; then
                echo "yt-dlp iOS OK: $(wc -c < assets/binaries/zeusdl) bytes"
                DOWNLOADED=true
              else
                rm -f assets/binaries/zeusdl
              fi
            fi
          fi
          if [ "$DOWNLOADED" = "false" ]; then
            echo "WARN: aucun binaire Mach-O — placeholder vide (TrollStore-safe)"
            : > assets/binaries/zeusdl
          fi
          echo "=== ZeusDL iOS final: $(wc -c < assets/binaries/zeusdl) bytes ==="

      - name: Patch pubspec.yaml pour assets/binaries/
        run: |
          if ! grep -q "assets/binaries/" pubspec.yaml; then
            sed -i '' 's|    - assets/icons/|    - assets/icons/\n    - assets/binaries/|' pubspec.yaml
          fi
          grep "assets/" pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate app icons (flutter_launcher_icons)
        run: dart run flutter_launcher_icons:main
        continue-on-error: false

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      - name: Patch Xcode project for CI (no team, manual signing)
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          # Switch Automatic → Manual so Xcode doesn't demand a Development Team
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          # Clear any codesign identity — we sign ad-hoc after build
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9][A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          echo "=== Signing settings after patch ==="
          grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING" "$PBXPROJ" | head -20

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign
          echo "Bundle: $(du -sh build/ios/iphoneos/Runner.app/ | cut -f1)"
          ls -lh build/ios/iphoneos/Runner.app/flutter_assets/assets/binaries/ 2>/dev/null \
            || echo "WARN: assets/binaries/ absent"

      - name: Fix zeusdl binary for TrollStore ldid compatibility
        run: |
          ZEUSDL="build/ios/iphoneos/Runner.app/flutter_assets/assets/binaries/zeusdl"
          if [ ! -f "$ZEUSDL" ]; then
            echo "No zeusdl found in bundle — skipping"
            exit 0
          fi
          MAGIC=$(xxd -p -l 4 "$ZEUSDL" 2>/dev/null || echo "")
          echo "zeusdl magic: $MAGIC (size: $(wc -c < "$ZEUSDL") bytes)"
          if [[ "$MAGIC" == "cafebabe" ]]; then
            echo "Fat binary → thinning to arm64"
            lipo "$ZEUSDL" -thin arm64 -output "${ZEUSDL}.arm64" 2>/dev/null \
              && mv "${ZEUSDL}.arm64" "$ZEUSDL" \
              || echo "lipo failed — will try to sign as-is"
            MAGIC=$(xxd -p -l 4 "$ZEUSDL" 2>/dev/null || echo "")
            echo "After thin — magic: $MAGIC size: $(wc -c < "$ZEUSDL") bytes"
          fi
          if [[ "$MAGIC" == "cffaedfe" || "$MAGIC" == "cefaedfe" ]]; then
            echo "Valid Mach-O — signing ad-hoc"
            /usr/bin/codesign --force --sign - --timestamp=none "$ZEUSDL" 2>/dev/null \
              && echo "zeusdl codesign OK" \
              || echo "WARN: codesign failed on zeusdl"
          else
            echo "Unknown magic '$MAGIC' — removing zeusdl from bundle (ldid would choke)"
            rm -f "$ZEUSDL"
          fi

      - name: Pre-sign all Mach-O binaries (TrollStore ldid compatibility)
        run: |
          APP="build/ios/iphoneos/Runner.app"
          echo "=== Pre-signing all Mach-O files in bundle ==="
          find "$APP" -type f | while read -r f; do
            MAGIC=$(xxd -p -l 4 "$f" 2>/dev/null || echo "")
            case "$MAGIC" in
              cefaedfe|cffaedfe)
                /usr/bin/codesign --force --sign - --timestamp=none "$f" 2>/dev/null \
                  && echo "signed: $f" || echo "WARN: skip $f"
                ;;
              cafebabe|bebafeca)
                # Fat binary — thin to arm64 first then sign
                lipo "$f" -thin arm64 -output "${f}.arm64" 2>/dev/null \
                  && mv "${f}.arm64" "$f" \
                  || true
                /usr/bin/codesign --force --sign - --timestamp=none "$f" 2>/dev/null \
                  && echo "signed (thinned): $f" || echo "WARN: skip $f"
                ;;
              *)
                # Not Mach-O — check extension; remove files ldid would choke on
                ext="${f##*.}"
                case "$ext" in
                  dylib|so|o)
                    echo "REMOVE non-Mach-O binary: $f (magic: $MAGIC)"
                    rm -f "$f"
                    ;;
                esac
                ;;
            esac
          done
          echo "=== Pre-sign done ==="

      - name: Signer (ldid + codesign deep ad-hoc)
        run: |
          APP="build/ios/iphoneos/Runner.app"
          ENT="ios/Runner/Runner.entitlements"
          brew install ldid 2>/dev/null || true
          if which ldid 2>/dev/null; then
            ldid -S"$ENT" "$APP/Runner" 2>/dev/null && echo "ldid main binary OK" || true
          fi
          # --deep recursively signs all nested frameworks/dylibs
          /usr/bin/codesign --force --deep --sign - --entitlements "$ENT" \
            --timestamp=none "$APP" 2>/dev/null && echo "codesign --deep OK" || true
          codesign -d --entitlements - "$APP" 2>/dev/null | head -10 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS.ipa Payload/
          rm -rf Payload
          ls -lh Watchtower-iOS.ipa
          unzip -l Watchtower-iOS.ipa | grep -E "Runner|zeusdl|Frameworks" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Watchtower-iOS.ipa
          compression-level: 0
          retention-days: 30
