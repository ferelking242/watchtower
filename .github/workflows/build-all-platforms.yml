name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs on new push — only the latest commit matters
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Web is kept as a reusable workflow so the same compatibility shims and
  # Dart-to-JavaScript checks run both on direct Pages deploys and here.
  build-web:
    name: Web
    uses: ./.github/workflows/build_web.yml
    with:
      deploy_pages: false
    secrets: inherit

  # ────────────────────────────────────────────────────────────
  # Android — split APKs per ABI (all Android architectures supported by Flutter)
  # Signed with KEYSTORE_B64 secret → watchtower-debug.keystore → profile buildType
  # ────────────────────────────────────────────────────────────
  build-android:
    name: Android (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: armeabi-v7a
            target: android-arm
          - label: arm64-v8a
            target: android-arm64
          - label: x86_64
            target: android-x64

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # Gradle caches are dependency/build-system state, not Dart source
      # output. Flutter's own build directory is invalidated by the source
      # graph; keeping lib/** out here preserves Gradle hits across Dart edits.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK extras (NDK, CMake)
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-extras-ndk27-cmake-${{ runner.os }}

      # Cache p7zip binary — avoids ~40s apt-get install on every run
      - name: Cache p7zip
        id: p7zip-cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/bin/7z
            /usr/lib/p7zip
          key: p7zip-${{ runner.os }}-v1

      - name: Install p7zip (if not cached)
        if: steps.p7zip-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y p7zip-full --quiet

      # ── Rust (required for rust_lib_watchtower FFI via cargokit) ────────────
      # ubuntu-latest has Rust pre-installed but NOT the Android cross-targets.
      # Without aarch64-linux-android / x86_64-linux-android, cargokit fails to
      # compile librust_lib_watchtower.so → APK ships without it → RustLib.init()
      # throws UnsatisfiedLinkError before runApp() → app freezes on splash screen.
      - name: Install Rust Android cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust (Android ${{ matrix.label }})
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: rust-android-${{ matrix.label }}-${{ runner.os }}-${{ hashFiles('rust/**/*.rs', 'rust_builder/**/*.rs', '**/Cargo.lock', '**/Cargo.toml', '**/pubspec.lock') }}
          restore-keys: rust-android-${{ matrix.label }}-${{ runner.os }}-

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Fix flutter_new_pipe_extractor missing assets dir
        run: |
          flutter pub get
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
          done

      - name: Build APK — ${{ matrix.label }}
        env:
          # Gradle's task cache fingerprints source inputs itself, so keep the
          # Actions cache key tied to build configuration and dependencies only.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
          # Keep the ABI filter aligned with the requested Flutter engine.
          # The app module intentionally disables Gradle ABI splits, so using
          # --split-per-abi here makes Flutter look for files Gradle never
          # creates (app-<abi>-profile.apk) and reports a false build failure.
          ORG_GRADLE_PROJECT_watchtowerCiAbi: "${{ matrix.label }}"
        run: |
          flutter build apk \
            --profile \
            --target-platform ${{ matrix.target }} \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}

      # Ship the APK itself: a phone user sideloads it straight away, whereas a
      # recompressed .7z archive first has to be extracted (and often cannot be
      # opened by the very device it is meant for).
      - name: Collect APK
        run: |
          mkdir -p artifacts
          TARGET_APK="build/app/outputs/flutter-apk/app-profile.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK not found. Available:"
            ls -lh build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "APK size: $(du -sh "$TARGET_APK")"
          cp "$TARGET_APK" "artifacts/watchtower-android-${{ matrix.label }}.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-${{ matrix.label }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Notify ntfy (Android build OK)
        if: success()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build Android OK (${{ matrix.label }})" \
            -H "Priority: default" \
            -d "APK built — sha ${{ github.sha }} — $COMMIT_MESSAGE" || true

      - name: Notify ntfy (Android build FAILED)
        if: failure()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build Android FAIL (${{ matrix.label }})" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "Android build FAILED — sha ${{ github.sha }} — $COMMIT_MESSAGE" || true

  # ────────────────────────────────────────────────────────────
  # Android Universal (all supported ABIs in one APK)
  # ────────────────────────────────────────────────────────────
  build-android-universal:
    name: Android (Universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK extras (NDK, CMake)
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-extras-ndk27-cmake-${{ runner.os }}

      - name: Cache p7zip
        id: p7zip-cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/bin/7z
            /usr/lib/p7zip
          key: p7zip-${{ runner.os }}-v1

      - name: Install p7zip (if not cached)
        if: steps.p7zip-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y p7zip-full --quiet

      # ── Rust (required for rust_lib_watchtower FFI via cargokit) ────────────
      - name: Install Rust Android cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust (Android universal)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: rust-android-universal-${{ runner.os }}-${{ hashFiles('rust/**/*.rs', 'rust_builder/**/*.rs', '**/Cargo.lock', '**/Cargo.toml', '**/pubspec.lock') }}
          restore-keys: rust-android-universal-${{ runner.os }}-

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Flutter pub get and prepare plugin assets
        run: |
          flutter pub get
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
          done

      - name: Build Universal APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
          ORG_GRADLE_PROJECT_watchtowerCiAllAbis: "true"
        run: flutter build apk --profile --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}

      # The all-ABI APK is shipped as-is so any phone installs it directly.
      - name: Collect Universal APK
        run: |
          TARGET_APK="build/app/outputs/flutter-apk/app-profile.apk"
          test -f "$TARGET_APK" || { echo "ERROR: $TARGET_APK not found"; ls -lh build/app/outputs/flutter-apk/ || true; exit 1; }
          cp "$TARGET_APK" watchtower-android-universal.apk
          ls -lh watchtower-android-universal.apk

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-universal
          path: watchtower-android-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Notify ntfy (Android Universal OK)
        if: success()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build Android Universal OK" \
            -H "Priority: default" \
            -d "Universal APK built — sha ${{ github.sha }} — $COMMIT_MESSAGE" || true

      - name: Notify ntfy (Android Universal FAILED)
        if: failure()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build Android Universal FAIL" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "Android Universal build FAILED — sha ${{ github.sha }} — $COMMIT_MESSAGE" || true

  # ────────────────────────────────────────────────────────────
  # Linux x64
  # Needs Rust for rust_lib_watchtower FFI plugin (cargokit)
  # Needs many GTK/GStreamer/media libs for media_kit and friends
  # ────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Checkout extension catalog
        uses: actions/checkout@v5
        with:
          repository: ferelking242/watchtower-extensions
          path: watchtower-extensions
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Rust (Linux x64)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: rust-linux-x64-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust_builder/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-linux-x64-${{ runner.os }}-

      # The hosted runner intermittently fails to resolve the apt mirror
      # (Temporary failure resolving 'azure.archive.ubuntu.com'), which left the
      # build without GTK. Retry the update, then retry the install, and fail
      # loudly instead of continuing into a confusing CMake error.
      - name: Install Linux build dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -y && break
            echo "apt-get update failed (attempt $i), retrying in 10s..."; sleep 10
          done
          install_deps() {
            sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libunwind-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libwpewebkit-1.0-dev libwpebackend-fdo-1.0-dev libsoup-3.0-dev liblzma-dev libblkid-dev libmount-dev \
            libglib2.0-dev libdbus-1-dev \
            libnotify-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev libjsoncpp-dev \
            libjson-glib-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libasound2-dev libpulse-dev libxcb-xfixes0-dev \
            libepoxy-dev libmpv-dev mpv \
            p7zip-full golang-go xvfb
          }
          for i in 1 2 3; do
            install_deps && break
            echo "apt-get install failed (attempt $i), retrying in 15s..."; sleep 15
          done
          pkg-config --exists gtk+-3.0 || { echo "ERROR: gtk+-3.0 is missing after apt"; exit 1; }

      - name: Ensure Xvfb is installed for CLI smoke tests
        run: sudo apt-get install -y xvfb

      - name: Install Rust (needed for rust_lib_watchtower FFI plugin via cargokit)
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # The pub cache is restored across runs, so a package patched by an
      # earlier run would come back already-modified and defeat the patch step.
      # Re-fetch the two packages the patch touches before applying it.
      - name: Flutter pub get and clean patched packages
        run: |
          flutter pub get
          rm -rf ~/.pub-cache/git/desktop_webview_window-* \
                 ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_linux-*
          flutter pub get

      - name: Fix Linux desktop_webview_window for current GLib and Clang
        run: |
          WEBVIEW_SOURCE="$(find ~/.pub-cache/git -path '*/desktop_webview_window-*/packages/desktop_webview_window/linux/webview_window.cc' -print -quit)"
          WEBVIEW_CMAKE="$(find ~/.pub-cache/hosted/pub.dev -path '*/flutter_inappwebview_linux-*/linux/CMakeLists.txt' -print -quit)"
          test -n "$WEBVIEW_SOURCE"
          test -n "$WEBVIEW_CMAKE"
          python3 - "$WEBVIEW_SOURCE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text()
          old = "    gdouble expires = g_date_time_get_seconds(soup_cookie_get_expires(cookie));\n\n    if (expires >= 0)\n"
          new = "    SoupDate *expires_date = soup_cookie_get_expires(cookie);\n    gdouble expires = expires_date == nullptr\n        ? -1\n        : static_cast<gdouble>(soup_date_to_time_t(expires_date));\n\n    if (expires >= 0)\n"
          if old in text:
              source.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("desktop_webview_window GLib code was not found")
          PY
          sed -i 's/ -Wno-deprecated-literal-operator//g' "$WEBVIEW_CMAKE"

      - name: Remove unsupported WPE plugin from Flutter Linux graph
        run: |
          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          plugin_name = "flutter_inappwebview_linux"
          graph = Path(".flutter-plugins-dependencies")
          if graph.exists():
              data = json.loads(graph.read_text())
              plugins = data.get("plugins", {}).get("linux", [])
              data["plugins"]["linux"] = [
                  plugin for plugin in plugins
                  if plugin.get("name") != plugin_name
              ]
              graph.write_text(json.dumps(data, indent=2) + "\n")

          legacy_graph = Path(".flutter-plugins")
          if legacy_graph.exists():
              legacy_graph.write_text(
                  "".join(
                      line for line in legacy_graph.read_text().splitlines(True)
                      if not line.startswith(plugin_name + "=")
                  )
              )

          # Pub get may have generated these files before the graph was
          # filtered. Remove the plugin from both generated representations.
          cmake = Path("linux/flutter/generated_plugins.cmake")
          registrant = Path("linux/flutter/generated_plugin_registrant.cc")
          if cmake.exists():
              text = cmake.read_text()
              text = re.sub(r"(?m)^\s*" + plugin_name + r"\s*\n", "", text)
              cmake.write_text(text)
          if registrant.exists():
              text = registrant.read_text()
              text = re.sub(
                  r"(?m)^\s*#include <" + plugin_name + r"/[^>]+>\n",
                  "",
                  text,
              )
              text = re.sub(
                  r"(?ms)^\s*g_autoptr\(FlPluginRegistrar\) "
                  + plugin_name
                  + r"_registrar =.*?"
                  + plugin_name
                  + r"_plugin_register_with_registrar\("
                  + plugin_name
                  + r"_registrar\);\n",
                  "",
                  text,
              )
              registrant.write_text(text)

          shutil.rmtree(
              "linux/flutter/ephemeral/.plugin_symlinks/" + plugin_name,
              ignore_errors=True,
          )
          PY

      - name: Build Linux
        env:
          CFLAGS: "-Wno-unknown-warning-option"
          CXXFLAGS: "-Wno-unknown-warning-option"
        run: flutter build linux --release --no-pub --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}

      - name: Expose Watchtower Linux binary
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          test -x "$BUNDLE/mangayomi"
          cp "$BUNDLE/mangayomi" "$BUNDLE/watchtower"

      - name: Test all extensions with the real Watchtower binary
        run: |
          set -o pipefail
          BUNDLE="build/linux/x64/release/bundle"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$BUNDLE/watchtower" --cli doctor
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$BUNDLE/watchtower" --cli extensions test \
            --repo "$GITHUB_WORKSPACE/watchtower-extensions" \
            --mode load \
            --concurrency 4 \
            --timeout 45 \
            --report "$GITHUB_WORKSPACE/watchtower-cli-report.json"

      - name: Upload Watchtower CLI extension report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: watchtower-cli-extension-report
          path: watchtower-cli-report.json

      - name: Package archive (7z LZMA2 max)
        run: |
          cd build/linux/x64/release/bundle
          7z a -t7z -mx=9 -mmt=2 \
            ../../../../../watchtower-linux-x64.7z .
          cd -
          ls -lh watchtower-linux-x64.7z

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v5
        with:
          name: linux-x64
          path: watchtower-linux-x64.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # macOS
  # ────────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # The runner is arm64 but the app is built universal, so cargokit needs
      # the x86_64 std too. Install both up front: a mid-build download from
      # static.rust-lang.org has failed the whole job on a transient DNS error.
      - name: Install Rust (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # See the Linux note: the cached package may already be patched, so
      # re-fetch it before the patch step runs.
      - name: Flutter pub get and clean patched packages
        run: |
          flutter pub get
          rm -rf ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_macos-*
          flutter pub get

      # flutter_inappwebview_macos 1.2.0-beta.3 declares conformance to
      # ASWebAuthenticationPresentationContextProviding with a presentationAnchor
      # method marked @available(macOS 10.15, *). Newer SDKs reject that: the
      # protocol requirement is 10.14, so a 10.15 method cannot witness it.
      # Move the conformance into a @available(macOS 10.15, *) extension instead,
      # which is the supported way to satisfy a protocol from a newer OS.
      - name: Patch macOS plugins for current Xcode
        run: |
          AUTH_SOURCE="$(find ~/.pub-cache -path '*flutter_inappwebview_macos*' -name 'WebAuthenticationSession.swift' -print -quit)"
          test -n "$AUTH_SOURCE"
          python3 - "$AUTH_SOURCE" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          text = source.read_text()

          marker = "extension WebAuthenticationSession: ASWebAuthenticationPresentationContextProviding"
          if marker in text:
              raise SystemExit(0)

          text, count = re.subn(
              r",\s*ASWebAuthenticationPresentationContextProviding", "", text, count=1
          )
          if count != 1:
              raise SystemExit("flutter_inappwebview_macos protocol conformance was not found")

          method = re.compile(
              r"\n[ \t]*@available\(macOS 10\.15, \*\)[ \t]*\n"
              r"[ \t]*public func presentationAnchor\(for session: ASWebAuthenticationSession\)"
              r" -> ASPresentationAnchor \{\n.*?\n[ \t]*\}\n",
              re.S,
          )
          text, count = method.subn("\n", text, count=1)
          if count != 1:
              raise SystemExit("flutter_inappwebview_macos presentationAnchor was not found")

          text = text.rstrip() + "\n\n" + (
              "// Conditional conformance: presentationAnchor(for:) builds an\n"
              "// ASWebAuthenticationSession (macOS 10.15+), so the protocol is only\n"
              "// satisfied from 10.15 on while the class keeps working below it.\n"
              "@available(macOS 10.15, *)\n"
              "extension WebAuthenticationSession: ASWebAuthenticationPresentationContextProviding {\n"
              "    public func presentationAnchor(for session: ASWebAuthenticationSession) -> ASPresentationAnchor {\n"
              "        return NSApplication.shared.windows.first { $0.isKeyWindow } ?? ASPresentationAnchor()\n"
              "    }\n"
              "}\n"
          )
          source.write_text(text)
          PY

      - name: Build macOS
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: flutter build macos --release --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}

      - name: Package archive (zip -9)
        run: |
          RELEASE_DIR="build/macos/Build/Products/Release"
          echo "--- Contents of $RELEASE_DIR ---"
          ls -la "$RELEASE_DIR" 2>/dev/null || echo "(dir not found)"
          APP=$(find "$RELEASE_DIR" -name "*.app" -maxdepth 2 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found. Scanning deeper..."
            find build/macos -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP"
          zip -r9 watchtower-macos.zip "$APP"
          ls -lh watchtower-macos.zip

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: watchtower-macos.zip
          compression-level: 9
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Windows x64
  # Needs Rust for rust_lib_watchtower FFI plugin (cargokit cmake)
  # ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Rust (needed for rust_lib_watchtower FFI plugin via cargokit)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Rust (Windows x64)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: rust-windows-x64-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust_builder/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-windows-x64-${{ runner.os }}-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}

      - name: Package archive (7z max)
        shell: pwsh
        run: |
          7z a -t7z -mx=9 -mmt=2 `
            watchtower-windows-x64.7z `
            build\windows\x64\runner\Release\*
          Get-Item watchtower-windows-x64.7z | Select-Object Name, Length

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: watchtower-windows-x64.7z
          compression-level: 0
          retention-days: 30

  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Rust (rust_lib_watchtower FFI via cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods spec repo
        uses: actions/cache@v5
        with:
          path: ~/.cocoapods
          key: cocoapods-repo-${{ runner.os }}-v1
          restore-keys: cocoapods-repo-${{ runner.os }}-

      - name: Cache ios/Pods
        id: pods-cache
        uses: actions/cache@v5
        with:
          path: ios/Pods
          # Key includes Podfile.lock so that any pubspec.yaml change that adds/removes
          # a pod invalidates the cache — prevents stale pods directory with old pod names
          # (e.g. rust_lib_mangayomi) being used after a package rename.
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix flutter_new_pipe_extractor missing assets dir
        run: |
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
            echo "Created: $dir/assets"
          done

      - name: Regenerate app icons (flutter_launcher_icons)
        run: dart run flutter_launcher_icons:main

      - name: Clean stale Podfile.lock (rust_lib_mangayomi → rust_lib_watchtower rename)
        run: |
          # The Podfile.lock was generated when the local FFI plugin was still named
          # rust_lib_mangayomi. After the rename to rust_lib_watchtower, the lock is
          # stale: flutter pub get creates .symlinks/plugins/rust_lib_watchtower/ but
          # pod install looks for rust_lib_mangayomi/ → not found → pods installed
          # from stale cache. Remove the old lock so pod install regenerates it fresh.
          if grep -q "rust_lib_mangayomi" ios/Podfile.lock 2>/dev/null; then
            echo "Stale Podfile.lock detected — removing to force regeneration"
            rm ios/Podfile.lock
          else
            echo "Podfile.lock is current — no action needed"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Pods cache hit — pod install"
            pod install
          else
            echo "Pods cache miss — pod install --repo-update"
            pod install --repo-update
          fi

      - name: Patch Xcode project for CI (manual signing, no team)
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9][A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;/PROVISIONING_PROFILE = "";/g' "$PBXPROJ"
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING" "$PBXPROJ" | sort -u || true

      # ── Build ────────────────────────────────────────────────────────────────
      # Mode profile : AOT compiled (comme release) mais avec quelques hooks de
      # profiling conservés — plus rapide à builder que release, perf proche du réel.
      # Phase 1: config-only pour générer le glue Flutter
      # Phase 2: xcodebuild direct avec CODE_SIGNING_ALLOWED=NO
      - name: Build iOS (profile, no codesign)
        run: |
          set -euo pipefail

          flutter build ios --profile --no-codesign --config-only \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }} \
            2>&1 | tail -20 || true

          echo "=== xcodebuild start ==="
          set +e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Profile \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            -derivedDataPath build/ios/derived \
            build 2>&1 | tee /tmp/xcode_build.log
          XCODE_EXIT=${PIPESTATUS[0]}
          set -e

          echo "--- xcodebuild exit: $XCODE_EXIT ---"
          grep -E "^(\*\*|error:|Build)" /tmp/xcode_build.log | tail -30 || true

          if [ "$XCODE_EXIT" -ne 0 ]; then
            echo "ERROR: xcodebuild failed (exit $XCODE_EXIT)" >&2
            exit "$XCODE_EXIT"
          fi

          APP_SRC="build/ios/derived/Build/Products/Profile-iphoneos/Runner.app"
          if [ ! -d "$APP_SRC" ]; then
            echo "ERROR: Runner.app introuvable à $APP_SRC" >&2
            ls -la build/ios/derived/Build/Products/ 2>/dev/null || echo "Derived products dir absent"
            exit 1
          fi
          rm -rf build/ios/iphoneos/Runner.app
          mkdir -p build/ios/iphoneos
          cp -r "$APP_SRC" build/ios/iphoneos/Runner.app
          echo "=== Bundle size: $(du -sh build/ios/iphoneos/Runner.app/ | cut -f1) ==="

      # ── Prepare bundle for TrollStore ldid ──────────────────────────────────
      # 1. Suppression par extension (non-Mach-O connus)
      # 2. Loop file -b sur les binaires de chaque framework:
      #    - ar archive (ex: wakelock_plus) → supprime le framework entier
      #    - FAT binary → thin à arm64 avec lipo
      #    - Mach-O arm64 → OK
      #    - Autre → supprime le binaire
      - name: Prepare bundle for TrollStore ldid compatibility
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"

          echo "=== Removing _CodeSignature dirs ==="
          find "$APP" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== Removing .car files (BOMStore) ==="
          find "$APP" -name "*.car" -delete 2>/dev/null || true

          echo "=== Removing .metallib files (Metal shader) ==="
          find "$APP" -name "*.metallib" -delete 2>/dev/null || true

          echo "=== Removing .storyboardc dirs INSIDE Frameworks only (NOT Main/LaunchScreen at app root) ==="
          # Main.storyboardc and LaunchScreen.storyboardc are required by UIKit (UIMainStoryboardFile=Main).
          # Only remove storyboardcs from framework bundles (e.g. flutter_inappwebview WebView.storyboardc).
          find "$APP/Frameworks" -name "*.storyboardc" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== Removing orphan .nib files inside Frameworks only ==="
          find "$APP/Frameworks" -name "*.nib" -delete 2>/dev/null || true

          echo "=== Removing icudtl.dat (ICU data binary) ==="
          find "$APP" -name "icudtl.dat" -delete 2>/dev/null || true

          echo "=== Removing Impeller shaders (.frag) ==="
          find "$APP" -name "*.frag" -delete 2>/dev/null || true

          echo "=== Framework binary check (file -b — méthode build vert) ==="
          THINNED=0; REMOVED_FW=0; REMOVED_BIN=0; ALREADY=0; SKIPPED=0

          for fw in "$APP/Frameworks"/*.framework; do
            NAME=$(basename "$fw" .framework)
            BIN="$fw/$NAME"
            [ -f "$BIN" ] || { SKIPPED=$((SKIPPED+1)); continue; }

            FILETYPE=$(file -b "$BIN")

            if echo "$FILETYPE" | grep -q "ar archive"; then
              rm -rf "$fw"
              echo "  REMOVED framework (ar archive): $NAME"
              REMOVED_FW=$((REMOVED_FW+1))

            elif echo "$FILETYPE" | grep -q "Mach-O.*universal"; then
              if lipo -info "$BIN" 2>/dev/null | grep -q "arm64"; then
                lipo "$BIN" -thin arm64 -output "${BIN}.thin" 2>/dev/null \
                  && mv "${BIN}.thin" "$BIN" \
                  && echo "  THINNED: $NAME (arm64)" \
                  && THINNED=$((THINNED+1)) \
                  || { echo "  WARN: lipo failed $NAME"; SKIPPED=$((SKIPPED+1)); }
              else
                echo "  WARN: $NAME fat sans slice arm64"
                SKIPPED=$((SKIPPED+1))
              fi

            elif echo "$FILETYPE" | grep -q "Mach-O"; then
              echo "  OK arm64: $NAME"
              ALREADY=$((ALREADY+1))

            else
              echo "  REMOVED unknown binary: $NAME ($FILETYPE)"
              rm -f "$BIN"
              REMOVED_BIN=$((REMOVED_BIN+1))
            fi
          done

          echo "=== Résultat: $THINNED thinned | $ALREADY OK | $REMOVED_FW fw removed | $REMOVED_BIN bin removed | $SKIPPED skip ==="
          echo "=== Bundle size: $(du -sh "$APP" | cut -f1) ==="

      # ── Signer (ldid + codesign adhoc) ──────────────────────────────────────
      - name: Sign for TrollStore (ldid + codesign adhoc)
        run: |
          APP="build/ios/iphoneos/Runner.app"
          ENT="ios/Runner/Runner.entitlements"
          brew install ldid 2>/dev/null || true

          echo "=== ldid frameworks ==="
          for fw in "$APP/Frameworks"/*.framework; do
            NAME=$(basename "$fw" .framework)
            BIN="$fw/$NAME"
            if [ -f "$BIN" ]; then
              ldid -S "$BIN" 2>/dev/null && echo "  ldid OK: $NAME" || echo "  ldid SKIP: $NAME"
            fi
          done

          echo "=== ldid Runner avec entitlements ==="
          ldid -S"$ENT" "$APP/Runner" && echo "ldid Runner OK"

          echo "=== Ad-hoc codesign ==="
          codesign --force --sign - --deep "$APP" 2>/dev/null || true

          echo "=== Vérification entitlements ==="
          ldid -e "$APP/Runner" 2>/dev/null | head -20 || true

      - name: Cleanup ldid residual files
        run: |
          APP="build/ios/iphoneos/Runner.app"
          COUNT=$(find "$APP" -name ".ldid.*" | wc -l)
          find "$APP" -name ".ldid.*" -delete
          echo "Cleaned $COUNT .ldid.* files"

      # ── Package IPA ─────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS-profile.ipa Payload/
          rm -rf Payload
          IPA_SIZE=$(du -sh Watchtower-iOS-profile.ipa | cut -f1)
          echo "=== IPA: $IPA_SIZE ==="
          echo "=== Frameworks dans IPA ==="
          unzip -l Watchtower-iOS-profile.ipa | grep "Frameworks/.*.framework/$" | wc -l
          echo "=== Vérif wakelock_plus (doit être absent — static lib) ==="
          unzip -l Watchtower-iOS-profile.ipa | grep wakelock || echo "wakelock_plus: static (absent) ✓"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: watchtower-ios-profile-ipa
          path: Watchtower-iOS-profile.ipa
          compression-level: 0
          retention-days: 30

      # Rolling release: delete old release+tag, force-push a fresh tag,
      # then create the release with gh CLI — avoids softprops race conditions.
      - name: Publish ios-latest rolling release
        run: |
          set -euo pipefail
          # 1. Delete old release + tag (silent if they don't exist yet)
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          git tag -d ios-latest 2>/dev/null || true
          git push origin :refs/tags/ios-latest 2>/dev/null || true
          # 2. Create a fresh annotated tag pointing at HEAD
          git tag -a ios-latest -m "iOS rolling release"
          git push origin ios-latest
          # 3. Create the GitHub release and upload the IPA
          gh release create ios-latest Watchtower-iOS-profile.ipa \
            --title "Watchtower iOS (TrollStore)" \
            --notes "IPA pour TrollStore (iPhone 7 / iOS 15+). Build auto depuis main." \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify ntfy (build OK)
        if: success()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build iOS OK" \
            -H "Priority: default" \
            -d "IPA profile built — sha ${{ github.sha }} — $COMMIT_MESSAGE" || true

      - name: Notify ntfy (build FAILED)
        if: failure()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Build iOS FAIL" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "iOS build FAILED — sha ${{ github.sha }} — $COMMIT_MESSAGE" || true

  # ────────────────────────────────────────────────────────────
  # iOS Simulator — uploadable to Appetize and other simulator services
  # This is intentionally a .zip containing Runner.app, not an IPA.
  # ────────────────────────────────────────────────────────────
  build-ios-simulator:
    name: iOS Simulator (Appetize)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Rust simulator targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache pub and CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ~/.cocoapods
            ios/Pods
          key: ios-simulator-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: ios-simulator-${{ runner.os }}-

      - name: Flutter pub get and prepare plugin assets
        run: |
          flutter pub get
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
          done

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS Simulator app
        run: |
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          test -d build/ios/iphonesimulator/Runner.app

      - name: Package simulator build
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            Watchtower-iOS-Simulator.zip
          ls -lh Watchtower-iOS-Simulator.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v5
        with:
          name: watchtower-ios-simulator
          path: Watchtower-iOS-Simulator.zip
          compression-level: 0
          retention-days: 30

  # Android TV ships real, installable APKs (not a renamed archive): a
  # sideloadable APK is what a TV/box user expects, and one APK per TV ABI lets
  # both 64-bit boxes and x86_64 emulators install directly. The manifest keeps
  # LEANBACK_LAUNCHER plus optional leanback/touchscreen, so the same source
  # yields a phone APK and a TV APK without a second divergent flavor.
  build-android-tv:
    name: Android TV (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tv-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock', 'android/gradle.properties') }}
          restore-keys: |
            gradle-tv-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Cache Android SDK extras (NDK, CMake)
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-extras-ndk27-cmake-${{ runner.os }}

      - name: Install Rust Android cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust (Android TV)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: rust-android-tv-${{ runner.os }}-${{ hashFiles('rust/**/*.rs', 'rust_builder/**/*.rs', '**/Cargo.lock', '**/Cargo.toml', '**/pubspec.lock') }}
          restore-keys: rust-android-tv-${{ runner.os }}-

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Flutter pub get and prepare plugin assets
        run: |
          flutter pub get
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
          done

      - name: Verify Android TV manifest
        run: |
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android.software.leanback' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.touchscreen.*required="false"' android/app/src/main/AndroidManifest.xml

      # splits.abi stays disabled, so --split-per-abi can never emit per-ABI
      # APKs; the app's build.gradle selects the ABIs with the watchtowerCiAbi
      # gradle property (ORG_GRADLE_PROJECT_* exports it).
      - name: Build TV APK (arm64-v8a)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dmaven.wagon.http.retryHandler.count=3"
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }} \
            --tree-shake-icons
          mkdir -p build/tv
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/tv/watchtower-tv-arm64.apk

      - name: Build TV APK (x86_64)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dmaven.wagon.http.retryHandler.count=3"
          ORG_GRADLE_PROJECT_watchtowerCiAbi: x86_64
        run: |
          rm -f build/app/outputs/flutter-apk/app-release.apk
          flutter build apk \
            --release \
            --target-platform android-x64 \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }} \
            --tree-shake-icons
          test -f build/app/outputs/flutter-apk/app-release.apk \
            || { echo 'x86_64 APK was not produced'; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/tv/watchtower-tv-x86_64.apk

      - name: Verify TV APKs
        run: |
          ls -lh build/tv
          for apk in build/tv/*.apk; do
            echo "=== $apk ==="
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)/apksigner" verify --print-certs "$apk" | head -3
          done

      - name: Upload Android TV artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-tv-universal
          path: build/tv/*.apk
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Publish — runs only when every build above is green.
  # Creates/refreshes the `v<version>` release with a clean,
  # Mihon-style body generated from the conventional commits and
  # tidy asset names (no CI noise, no duplicate suffixes).
  # ────────────────────────────────────────────────────────────
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-web
      - build-android
      - build-android-universal
      - build-linux
      - build-macos
      - build-windows
      - build-ios
      - build-android-tv
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download every build artifact
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Compute version
        id: ver
        run: |
          MAJOR=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+)\..*/\1/')
          MINOR=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*[0-9]+\.([0-9]+)\..*/\1/')
          VNAME="${MAJOR}.${MINOR}.${GITHUB_RUN_NUMBER}"
          echo "name=${VNAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VNAME}"  >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts with clean names
        run: |
          set -euo pipefail
          mkdir -p dist
          V="${{ steps.ver.outputs.name }}"
          # Map the raw artifact folder names to the clean release name.
          SRC_android_armv7a="artifacts/android-armeabi-v7a"
          SRC_android_arm64="artifacts/android-arm64-v8a"
          SRC_android_x86_64="artifacts/android-x86_64"
          SRC_android_universal="artifacts/android-universal"
          SRC_android_tv="artifacts/android-tv-universal"
          SRC_linux="artifacts/linux-x64"
          SRC_macos="artifacts/macos"
          SRC_windows="artifacts/windows-x64"
          SRC_ios="artifacts/watchtower-ios-profile-ipa"
          SRC_ios_sim="artifacts/watchtower-ios-simulator"
          copy() { # $1 src-dir $2 clean-name  (first file in the dir)
            local dir="$1" name="$2"
            local file
            file=$(find "$dir" -type f -maxdepth 2 2>/dev/null | head -1)
            if [ -n "$file" ]; then
              cp "$file" "dist/$name"
              echo "  + $name"
            fi
          }
          copy_named() { # $1 src-dir $2 basename $3 clean-name
            local dir="$1" base="$2" name="$3"
            local file
            file=$(find "$dir" -type f -name "$base" -maxdepth 2 2>/dev/null | head -1)
            if [ -n "$file" ]; then
              cp "$file" "dist/$name"
              echo "  + $name"
            fi
          }
          echo "Collecting release assets:"
          copy "$SRC_android_armv7a" "Watchtower-${V}-android-armv7a.apk"
          copy "$SRC_android_arm64"  "Watchtower-${V}-android-arm64.apk"
          copy "$SRC_android_x86_64" "Watchtower-${V}-android-x86_64.apk"
          copy "$SRC_android_universal" "Watchtower-${V}-android-universal.apk"
          copy_named "$SRC_android_tv" "watchtower-tv-arm64.apk"  "Watchtower-${V}-android-tv-arm64.apk"
          copy_named "$SRC_android_tv" "watchtower-tv-x86_64.apk" "Watchtower-${V}-android-tv-x86_64.apk"
          copy "$SRC_linux"          "Watchtower-${V}-linux-x64.7z"
          copy "$SRC_macos"          "Watchtower-${V}-macos.zip"
          copy "$SRC_windows"        "Watchtower-${V}-windows-x64.7z"
          copy "$SRC_ios"            "Watchtower-${V}-ios.ipa"
          copy "$SRC_ios_sim"        "Watchtower-${V}-ios-simulator.zip"
          # Web is a directory bundle; zip it for the release.
          if [ -d artifacts/watchtower-web ]; then
            ( cd artifacts/watchtower-web && zip -qr "$GITHUB_WORKSPACE/dist/Watchtower-${V}-web.zip" . )
            echo "  + Watchtower-${V}-web.zip"
          fi
          echo "--- dist ---"
          ls -lh dist
          test "$(ls -1 dist | wc -l)" -gt 0

      - name: Generate release notes
        run: |
          V="${{ steps.ver.outputs.name }}"
          ASSETS=()
          add() { [ -f "dist/$2" ] && ASSETS+=(--asset "$1:$2"); }
          add "Android armv7a"        "Watchtower-${V}-android-armv7a.apk"
          add "Android arm64"         "Watchtower-${V}-android-arm64.apk"
          add "Android x86_64"        "Watchtower-${V}-android-x86_64.apk"
          add "Android universal"     "Watchtower-${V}-android-universal.apk"
          add "Android TV arm64 (APK)"  "Watchtower-${V}-android-tv-arm64.apk"
          add "Android TV x86_64 (APK)" "Watchtower-${V}-android-tv-x86_64.apk"
          add "Linux x64"             "Watchtower-${V}-linux-x64.7z"
          add "macOS"                 "Watchtower-${V}-macos.zip"
          add "Windows x64"           "Watchtower-${V}-windows-x64.7z"
          add "iOS (TrollStore)"      "Watchtower-${V}-ios.ipa"
          add "iOS Simulator"         "Watchtower-${V}-ios-simulator.zip"
          add "Web (PWA)"             "Watchtower-${V}-web.zip"
          python3 scripts/release_notes.py \
            --version "$V" \
            --build "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --date "${{ steps.ver.outputs.date }}" \
            --output RELEASE_NOTES.md \
            "${ASSETS[@]}"
          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git -c user.name=github-actions \
              -c user.email=github-actions@users.noreply.github.com \
              tag -a "$TAG" -m "Watchtower ${{ steps.ver.outputs.name }}"
          git push origin "$TAG"
          gh release create "$TAG" dist/* \
            --title "Watchtower ${{ steps.ver.outputs.name }}" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Notify ntfy (release published)
        if: success()
        run: |
          curl -s -X POST https://ntfy.sh/watchtower \
            -H "Title: Watchtower ${{ steps.ver.outputs.name }} publié" \
            -H "Priority: default" \
            -H "Tags: package" \
            -d "Release ${{ steps.ver.outputs.tag }} publiée depuis main" || true
