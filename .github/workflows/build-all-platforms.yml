name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Android — split APKs per ABI (arm64-v8a and x86_64 only)
  # Signed with KEYSTORE_B64 secret → watchtower-debug.keystore → profile buildType
  # ────────────────────────────────────────────────────────────
  build-android:
    name: Android (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-v8a
            target: android-arm64
          - label: x86_64
            target: android-x64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Bundle ZeusDL as Flutter asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Determine ZeusDL arch from matrix target
          if [[ "${{ matrix.target }}" == *"arm64"* ]]; then
            ZEUSDL_ARCH="arm64"
          else
            ZEUSDL_ARCH="x86_64"
          fi
          echo "=== Bundling ZeusDL ($ZEUSDL_ARCH) as Flutter asset ==="
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ferelking242/zeusdl/releases/latest")
          ZEUSDL_VERSION=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "ZeusDL version: $ZEUSDL_VERSION"
          # Remove ET_EXEC stubs — Android 10+ rejects non-PIE .so at install time
          rm -f android/app/src/main/jniLibs/arm64-v8a/libzeusdl.so
          rm -f android/app/src/main/jniLibs/x86_64/libzeusdl.so
          # Bundle binary as Flutter asset (extracted to internal storage at runtime)
          mkdir -p assets/binaries
          URL="https://github.com/ferelking242/zeusdl/releases/download/${ZEUSDL_VERSION}/zeusdl-android-${ZEUSDL_ARCH}"
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o assets/binaries/zeusdl
          SIZE=$(wc -c < assets/binaries/zeusdl)
          MAGIC=$(head -c 4 assets/binaries/zeusdl | xxd -p)
          if [ "$MAGIC" != "7f454c46" ]; then
            echo "ERROR: not ELF (magic=$MAGIC)"; exit 1
          fi
          echo "ZeusDL asset ($ZEUSDL_ARCH): $SIZE bytes, ELF OK"
          echo "=== Done ==="


      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK — ${{ matrix.label }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.keepAlive=false"
        run: |
          flutter build apk \
            --profile \
            --target-platform ${{ matrix.target }} \
            --split-per-abi

      - name: FitGirl-style repack — extract APK then LZMA2 ultra on raw files
        run: |
          sudo apt-get install -y p7zip-full --quiet
          mkdir -p artifacts apk_raw
          TARGET_APK="build/app/outputs/flutter-apk/app-${{ matrix.label }}-profile.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK not found. Available:"
            ls -lh build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "APK size: $(du -sh $TARGET_APK)"
          # FITGIRL TRICK: APKs store native .so UNCOMPRESSED for mmap
          # Extract ZIP → compress raw files → 40-60% gain on libs
          unzip -q "$TARGET_APK" -d apk_raw/
          echo "Extracted: $(du -sh apk_raw/) | libs: $(du -sh apk_raw/lib/ 2>/dev/null || echo n/a)"
          7z a -t7z -mx=9 -mmt=2 -mfb=128 -md=64m -ms=on \
            "artifacts/app-${{ matrix.label }}-profile.7z" apk_raw/
          rm -rf apk_raw
          echo "=== Final artifact ==="
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.label }}
          path: artifacts/*.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Android Universal (all supported ABIs in one APK)
  # ────────────────────────────────────────────────────────────
  build-android-universal:
    name: Android (Universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Bundle ZeusDL as Flutter asset (arm64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Bundling ZeusDL (arm64) as Flutter asset for Universal APK ==="
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ferelking242/zeusdl/releases/latest")
          ZEUSDL_VERSION=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "ZeusDL version: $ZEUSDL_VERSION"
          rm -f android/app/src/main/jniLibs/arm64-v8a/libzeusdl.so
          rm -f android/app/src/main/jniLibs/x86_64/libzeusdl.so
          mkdir -p assets/binaries
          URL="https://github.com/ferelking242/zeusdl/releases/download/${ZEUSDL_VERSION}/zeusdl-android-arm64"
          curl -fsSL "$URL" -o assets/binaries/zeusdl
          SIZE=$(wc -c < assets/binaries/zeusdl)
          MAGIC=$(head -c 4 assets/binaries/zeusdl | xxd -p)
          if [ "$MAGIC" != "7f454c46" ]; then echo "ERROR: not ELF"; exit 1; fi
          echo "ZeusDL asset: $SIZE bytes, ELF OK"
          echo "=== Done ==="


      - name: Flutter pub get
        run: flutter pub get

      - name: Build Universal APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.keepAlive=false"
        run: flutter build apk --profile

      - name: FitGirl-style repack — extract APK then LZMA2 ultra on raw files
        run: |
          sudo apt-get install -y p7zip-full --quiet
          mkdir -p apk_raw
          TARGET_APK="build/app/outputs/flutter-apk/app-profile.apk"
          echo "APK size: $(du -sh $TARGET_APK)"
          unzip -q "$TARGET_APK" -d apk_raw/
          echo "Extracted: $(du -sh apk_raw/) | libs: $(du -sh apk_raw/lib/ 2>/dev/null || echo n/a)"
          7z a -t7z -mx=9 -mmt=2 -mfb=128 -md=64m -ms=on \
            watchtower-android-universal.7z apk_raw/
          rm -rf apk_raw
          ls -lh watchtower-android-universal.7z

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: watchtower-android-universal.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # iOS — IPA sideloadable (AltStore / SideStore / Dopamine / TrollStore)
  #
  # Fixes vs. ancienne version:
  #   1. ZeusDL iOS arm64 (Mach-O) bundelé dans assets/binaries/zeusdl
  #   2. pubspec.yaml liste assets/binaries/ AVANT flutter build
  #   3. IPA signé avec ldid (jailbreak) + codesign ad-hoc (AltStore)
  #   4. Entitlements: get-task-allow + platform-application (Dopamine)
  # ────────────────────────────────────────────────────────────
  build-ios:
    name: iOS (sideload IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust (rust_lib_watchtower FFI via cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Bundle ZeusDL iOS arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets/binaries
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ferelking242/zeusdl/releases/latest" 2>/dev/null || echo '{}')
          ZEUSDL_VERSION=$(echo "$RELEASE_JSON" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo '')
          DOWNLOADED=false
          if [ -n "$ZEUSDL_VERSION" ]; then
            for ASSET in "zeusdl-ios-arm64" "zeusdl-ios" "yt-dlp_ios"; do
              URL="https://github.com/ferelking242/zeusdl/releases/download/${ZEUSDL_VERSION}/${ASSET}"
              echo "Trying: $URL"
              if curl -fsSL "$URL" -o assets/binaries/zeusdl 2>/dev/null; then
                MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
                if [[ "$MAGIC" == "cefaedfe" || "$MAGIC" == "cffaedfe" || "$MAGIC" == "cafebabe" ]]; then
                  echo "Mach-O OK: $(wc -c < assets/binaries/zeusdl) bytes"
                  DOWNLOADED=true; break
                else
                  rm -f assets/binaries/zeusdl
                fi
              fi
            done
          fi
          # Fallback: yt-dlp officiel iOS
          if [ "$DOWNLOADED" = "false" ]; then
            YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_ios"
            if curl -fsSL "$YTDLP_URL" -o assets/binaries/zeusdl 2>/dev/null; then
              MAGIC=$(xxd -p -l 4 assets/binaries/zeusdl 2>/dev/null || echo "")
              if [[ "$MAGIC" == "cefaedfe" || "$MAGIC" == "cffaedfe" || "$MAGIC" == "cafebabe" ]]; then
                echo "yt-dlp iOS OK: $(wc -c < assets/binaries/zeusdl) bytes"
                DOWNLOADED=true
              else
                rm -f assets/binaries/zeusdl
              fi
            fi
          fi
          if [ "$DOWNLOADED" = "false" ]; then
            echo "WARN: aucun binaire Mach-O — stub minimal"
            printf '\xCE\xFA\xED\xFE\x0C\x00\x00\x01\x00\x00\x00\x00\x02\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x85\x00\x20\x00' > assets/binaries/zeusdl
          fi
          echo "=== ZeusDL iOS final: $(wc -c < assets/binaries/zeusdl) bytes ==="

      - name: Patch pubspec.yaml pour assets/binaries/
        run: |
          if ! grep -q "assets/binaries/" pubspec.yaml; then
            sed -i '' 's|    - assets/icons/|    - assets/icons/\n    - assets/binaries/|' pubspec.yaml
          fi
          grep "assets/" pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign
          echo "Bundle: $(du -sh build/ios/iphoneos/Runner.app/ | cut -f1)"
          ls -lh build/ios/iphoneos/Runner.app/flutter_assets/assets/binaries/ 2>/dev/null \
            || echo "WARN: assets/binaries/ absent"

      - name: Signer (ldid + codesign ad-hoc)
        run: |
          APP="build/ios/iphoneos/Runner.app"
          ENT="ios/Runner/Runner.entitlements"
          brew install ldid 2>/dev/null || true
          if which ldid 2>/dev/null; then
            ldid -S"$ENT" "$APP/Runner" 2>/dev/null && echo "ldid OK" || true
          fi
          /usr/bin/codesign --force --sign - --entitlements "$ENT" \
            --timestamp=none "$APP" 2>/dev/null && echo "codesign OK" || true
          codesign -d --entitlements - "$APP" 2>/dev/null | head -10 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS.ipa Payload/
          rm -rf Payload
          ls -lh Watchtower-iOS.ipa
          unzip -l Watchtower-iOS.ipa | grep -E "Runner|zeusdl|Frameworks" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Watchtower-iOS.ipa
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Linux x64
  # Needs Rust for rust_lib_watchtower FFI plugin (cargokit)
  # Needs many GTK/GStreamer/media libs for media_kit and friends
  # ────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libmount-dev \
            libglib2.0-dev libdbus-1-dev \
            p7zip-full golang-go
          sudo apt-get install -y libsecret-1-dev 2>/dev/null || true
          sudo apt-get install -y libjsoncpp-dev 2>/dev/null || true
          sudo apt-get install -y libgstreamer1.0-dev 2>/dev/null || true
          sudo apt-get install -y libgstreamer-plugins-base1.0-dev 2>/dev/null || true
          sudo apt-get install -y libgstreamer-plugins-bad1.0-dev 2>/dev/null || true
          sudo apt-get install -y gstreamer1.0-plugins-good 2>/dev/null || true
          sudo apt-get install -y gstreamer1.0-plugins-bad 2>/dev/null || true
          sudo apt-get install -y libasound2-dev 2>/dev/null || true
          sudo apt-get install -y libpulse-dev 2>/dev/null || true
          sudo apt-get install -y libxcb-xfixes0-dev 2>/dev/null || true
          sudo apt-get install -y libepoxy-dev 2>/dev/null || true
          sudo apt-get install -y libmpv-dev 2>/dev/null || true
          sudo apt-get install -y mpv 2>/dev/null || true
          sudo apt-get install -y libstdc++-12-dev 2>/dev/null || true
          sudo apt-get install -y libstdc++-13-dev 2>/dev/null || true
          sudo apt-get install -y libstdc++-14-dev 2>/dev/null || true

      - name: Install Rust (needed for rust_lib_watchtower FFI plugin via cargokit)
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package archive (7z LZMA2 max)
        run: |
          cd build/linux/x64/release/bundle
          7z a -t7z -mx=9 -mmt=2 \
            ../../../../../watchtower-linux-x64.7z .
          cd -
          ls -lh watchtower-linux-x64.7z

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: watchtower-linux-x64.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # macOS
  # ────────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package archive (zip -9)
        run: |
          RELEASE_DIR="build/macos/Build/Products/Release"
          echo "--- Contents of $RELEASE_DIR ---"
          ls -la "$RELEASE_DIR" 2>/dev/null || echo "(dir not found)"
          APP=$(find "$RELEASE_DIR" -name "*.app" -maxdepth 2 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found. Scanning deeper..."
            find build/macos -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP"
          zip -r9 watchtower-macos.zip "$APP"
          ls -lh watchtower-macos.zip

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: watchtower-macos.zip
          compression-level: 9
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Windows x64
  # Needs Rust for rust_lib_watchtower FFI plugin (cargokit cmake)
  # ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Rust (needed for rust_lib_watchtower FFI plugin via cargokit)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package archive (7z max)
        shell: pwsh
        run: |
          7z a -t7z -mx=9 -mmt=2 `
            watchtower-windows-x64.7z `
            build\windows\x64\runner\Release\*
          Get-Item watchtower-windows-x64.7z | Select-Object Name, Length

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: watchtower-windows-x64.7z
          compression-level: 0
          retention-days: 30
