name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Android — split APKs per ABI (release, ultra-compressed artifact)
  # ────────────────────────────────────────────────────────────
  build-android:
    name: Android (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-v8a
            target: android-arm64
          - label: x86_64
            target: android-x64
          - label: armeabi-v7a
            target: android-arm

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build APK — ${{ matrix.label }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --target-platform ${{ matrix.target }} \
            --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Repack APK with maximum compression (7z LZMA2)
        run: |
          sudo apt-get install -y p7zip-full --quiet
          mkdir -p artifacts
          for apk in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$apk" .apk)
            7z a -t7z -mx=9 -mmt=2 -mfb=64 -md=32m \
              "artifacts/${base}-${{ matrix.label }}.7z" "$apk"
          done
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.label }}
          path: artifacts/*.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Android Universal (all ABIs — ultra-compressed)
  # ────────────────────────────────────────────────────────────
  build-android-universal:
    name: Android (Universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build Universal APK
        run: flutter build apk --release --no-tree-shake-icons
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Repack APK with maximum compression (7z LZMA2)
        run: |
          sudo apt-get install -y p7zip-full --quiet
          7z a -t7z -mx=9 -mmt=2 -mfb=64 -md=32m \
            watchtower-android-universal.7z \
            build/app/outputs/flutter-apk/app-release.apk
          ls -lh watchtower-android-universal.7z

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: watchtower-android-universal.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # iOS (no-codesign — sideload IPA)
  # ────────────────────────────────────────────────────────────
  build-ios:
    name: iOS (no-codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package IPA (max compressed)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Watchtower-iOS.ipa Payload/
          rm -rf Payload
          ls -lh Watchtower-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Watchtower-iOS.ipa
          compression-level: 9
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Linux x64
  # ────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libblkid-dev libmount-dev \
            p7zip-full
          # libstdc++ version varies — install all available
          sudo apt-get install -y libstdc++-12-dev 2>/dev/null || true
          sudo apt-get install -y libstdc++-13-dev 2>/dev/null || true
          sudo apt-get install -y libstdc++-14-dev 2>/dev/null || true

      - name: Install Rust (needed for rust_lib_watchtower FFI plugin)
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package archive (7z LZMA2 max)
        run: |
          cd build/linux/x64/release/bundle
          7z a -t7z -mx=9 -mmt=2 \
            ../../../../../watchtower-linux-x64.7z .
          cd -
          ls -lh watchtower-linux-x64.7z

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: watchtower-linux-x64.7z
          compression-level: 0
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # macOS
  # ────────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package archive (zip -9)
        run: |
          cd build/macos/Build/Products/Release
          zip -r9 ../../../../../watchtower-macos.zip Watchtower.app
          cd -
          ls -lh watchtower-macos.zip

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: watchtower-macos.zip
          compression-level: 9
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Windows x64
  # ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-tree-shake-icons

      - name: Package archive (7z max)
        shell: pwsh
        run: |
          7z a -t7z -mx=9 -mmt=2 `
            watchtower-windows-x64.7z `
            build\windows\x64\runner\Release\*
          Get-Item watchtower-windows-x64.7z | Select-Object Name, Length

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: watchtower-windows-x64.7z
          compression-level: 0
          retention-days: 30
