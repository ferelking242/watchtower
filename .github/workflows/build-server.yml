name: Build Linux Headless CLI

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/cli/**'
      - 'lib/main.dart'
      - 'linux/**'
      - 'scripts/install-linux-headless.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-server.yml'
  pull_request:
    paths:
      - 'lib/cli/**'
      - 'lib/main.dart'
      - 'linux/**'
      - 'scripts/install-linux-headless.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cli:
    name: Linux headless CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libunwind-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libwpewebkit-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libsoup-3.0-dev liblzma-dev libblkid-dev libmount-dev \
            libglib2.0-dev libdbus-1-dev libnotify-dev \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad libasound2-dev libpulse-dev \
            libxcb-xfixes0-dev libepoxy-dev libmpv-dev mpv p7zip-full xvfb

      - name: Checkout extension catalog
        uses: actions/checkout@v5
        with:
          repository: ferelking242/watchtower-extensions
          path: watchtower-extensions
          lfs: true

      - name: Prepare Linux build
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          find ~/.pub-cache/git -maxdepth 1 -name "flutter_new_pipe_extractor*" -type d | while read dir; do
            mkdir -p "$dir/assets"
          done

      - name: Fix Linux desktop_webview_window for current GLib and Clang
        run: |
          WEBVIEW_SOURCE="$(find ~/.pub-cache/git -path '*/desktop_webview_window-*/packages/desktop_webview_window/linux/webview_window.cc' -print -quit)"
          WEBVIEW_CMAKE="$(find ~/.pub-cache/hosted/pub.dev -path '*/flutter_inappwebview_linux-*/linux/CMakeLists.txt' -print -quit)"
          test -n "$WEBVIEW_SOURCE"
          test -n "$WEBVIEW_CMAKE"
          python3 - "$WEBVIEW_SOURCE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text()
          old = "    gdouble expires = g_date_time_get_seconds(soup_cookie_get_expires(cookie));\n\n    if (expires >= 0)\n"
          new = "    SoupDate *expires_date = soup_cookie_get_expires(cookie);\n    gdouble expires = expires_date == nullptr\n        ? -1\n        : static_cast<gdouble>(soup_date_to_time_t(expires_date));\n\n    if (expires >= 0)\n"
          if old not in text:
              raise SystemExit("desktop_webview_window GLib code was not found")
          source.write_text(text.replace(old, new, 1))
          PY
          sed -i 's/ -Wno-deprecated-literal-operator//g' "$WEBVIEW_CMAKE"

      - name: Remove unsupported WPE plugin from Flutter Linux graph
        run: |
          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          plugin_name = "flutter_inappwebview_linux"
          graph = Path(".flutter-plugins-dependencies")
          if graph.exists():
              data = json.loads(graph.read_text())
              plugins = data.get("plugins", {}).get("linux", [])
              data["plugins"]["linux"] = [
                  plugin for plugin in plugins
                  if plugin.get("name") != plugin_name
              ]
              graph.write_text(json.dumps(data, indent=2) + "\n")

          legacy_graph = Path(".flutter-plugins")
          if legacy_graph.exists():
              legacy_graph.write_text(
                  "".join(
                      line for line in legacy_graph.read_text().splitlines(True)
                      if not line.startswith(plugin_name + "=")
                  )
              )

          cmake = Path("linux/flutter/generated_plugins.cmake")
          registrant = Path("linux/flutter/generated_plugin_registrant.cc")
          if cmake.exists():
              text = cmake.read_text()
              text = re.sub(r"(?m)^\s*" + plugin_name + r"\s*\n", "", text)
              cmake.write_text(text)
          if registrant.exists():
              text = registrant.read_text()
              text = re.sub(
                  r"(?m)^\s*#include <" + plugin_name + r"/[^>]+>\n",
                  "",
                  text,
              )
              text = re.sub(
                  r"(?ms)^\s*g_autoptr\(FlPluginRegistrar\) "
                  + plugin_name
                  + r"_registrar =.*?"
                  + plugin_name
                  + r"_plugin_register_with_registrar\("
                  + plugin_name
                  + r"_registrar\);\n",
                  "",
                  text,
              )
              registrant.write_text(text)

          shutil.rmtree(
              "linux/flutter/ephemeral/.plugin_symlinks/" + plugin_name,
              ignore_errors=True,
          )
          PY

      - name: Build Linux
        env:
          CFLAGS: "-Wno-unknown-warning-option"
          CXXFLAGS: "-Wno-unknown-warning-option"
        run: flutter build linux --release --no-pub

      - name: Expose Watchtower Linux binary
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          test -x "$BUNDLE/mangayomi"
          cp "$BUNDLE/mangayomi" "$BUNDLE/watchtower"

      - name: Verify clean machine-readable CLI output
        run: |
          set -euo pipefail
          BUNDLE="build/linux/x64/release/bundle"
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -ac \
            > "$GITHUB_WORKSPACE/watchtower-xvfb-verify.log" 2>&1 &
          XVFB_PID=$!
          cleanup_xvfb() {
            if kill -0 "$XVFB_PID" 2>/dev/null; then
              kill "$XVFB_PID"
            fi
          }
          trap cleanup_xvfb EXIT
          for attempt in $(seq 1 20); do
            if [ -S /tmp/.X11-unix/X99 ]; then break; fi
            sleep 0.25
          done
          test -S /tmp/.X11-unix/X99
          export DISPLAY=:99
          doctor_status=0
          "$BUNDLE/watchtower" --cli doctor --json \
            > "$GITHUB_WORKSPACE/watchtower-cli-doctor.json" \
            2> "$GITHUB_WORKSPACE/watchtower-cli-doctor.stderr.log" \
            || doctor_status=$?
          cat "$GITHUB_WORKSPACE/watchtower-cli-doctor.stderr.log" >&2
          if [ "$doctor_status" -ne 0 ]; then
            echo "CLI doctor exited with status $doctor_status" >&2
            exit "$doctor_status"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("watchtower-cli-doctor.json").read_text())
          assert result.get("native") is True, "CLI doctor did not report a native build"
          quick_js = result.get("quickJs")
          assert isinstance(quick_js, dict), "CLI doctor did not report QuickJS state"
          assert quick_js.get("available") is True, "CLI doctor did not load QuickJS"
          PY
          "$BUNDLE/watchtower" --cli help >/dev/null
          catalog_status=0
          "$BUNDLE/watchtower" --cli extensions list \
            --repo "$GITHUB_WORKSPACE/watchtower-extensions" \
            --json > "$GITHUB_WORKSPACE/watchtower-cli-catalog.json" \
            2> "$GITHUB_WORKSPACE/watchtower-cli-catalog.stderr.log" \
            || catalog_status=$?
          cat "$GITHUB_WORKSPACE/watchtower-cli-catalog.stderr.log" >&2
          if [ "$catalog_status" -ne 0 ]; then
            echo "CLI catalogue command exited with status $catalog_status" >&2
            exit "$catalog_status"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("watchtower-cli-catalog.json").read_text())
          assert isinstance(result.get("sources"), list), "CLI catalogue JSON has no sources list"
          assert result.get("total") == len(result["sources"]), "CLI catalogue count is inconsistent"
          assert result.get("failures") == [], "CLI reported catalogue loading failures"
          print(f"Validated JSON catalogue with {result['total']} sources")
          PY

      - name: Verify extension filters select the expected subset
        run: |
          set -euo pipefail
          BUNDLE="build/linux/x64/release/bundle"
          REPO="$GITHUB_WORKSPACE/watchtower-extensions"
          run_filter() {
            local name="$1"; shift
            "$BUNDLE/watchtower" --cli extensions list --repo "$REPO" --json "$@" \
              > "$GITHUB_WORKSPACE/watchtower-filter-$name.json" \
              2> "$GITHUB_WORKSPACE/watchtower-filter-$name.stderr.log"
          }
          run_filter all
          run_filter fr --lang fr
          run_filter fr-en --lang fr,en
          run_filter fr-sfw --lang fr --sfw
          run_filter fr-nsfw --lang fr --nsfw
          run_filter watch --type watch
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(f"watchtower-filter-{name}.json").read_text())

          def langs(result):
              return {source.get("lang") for source in result["sources"]}

          all_result = load("all")
          total = all_result["total"]
          assert total > 0, "The extension catalogue is empty"

          fr = load("fr")
          assert fr["total"] > 0, "No French extension was selected"
          assert langs(fr) == {"fr"}, f"Non-French sources leaked: {langs(fr)}"
          assert fr["filters"]["languages"] == ["fr"], fr["filters"]

          fr_en = load("fr-en")
          assert langs(fr_en) <= {"fr", "en"}, f"Unexpected languages: {langs(fr_en)}"
          assert fr_en["total"] >= fr["total"], "Adding a language reduced the selection"

          fr_sfw = load("fr-sfw")
          fr_nsfw = load("fr-nsfw")
          assert all(not s.get("isNsfw") for s in fr_sfw["sources"]), "SFW selection kept NSFW sources"
          assert all(s.get("isNsfw") for s in fr_nsfw["sources"]), "NSFW selection kept SFW sources"
          assert fr_sfw["total"] + fr_nsfw["total"] == fr["total"], (
              "SFW + NSFW counts do not match the unfiltered French count"
          )

          watch = load("watch")
          assert watch["total"] > 0, "No watch extension was selected"
          assert {s.get("type") for s in watch["sources"]} == {"watch"}, "Type filter leaked other kinds"

          print(
              f"Filters OK — all={total} fr={fr['total']} "
              f"fr+en={fr_en['total']} fr/sfw={fr_sfw['total']} "
              f"fr/nsfw={fr_nsfw['total']} watch={watch['total']}"
          )
          PY

      - name: Test five French Watch extensions end to end
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          Xvfb :100 -screen 0 1280x720x24 -nolisten tcp -ac \
            > "$GITHUB_WORKSPACE/watchtower-xvfb-test.log" 2>&1 &
          XVFB_PID=$!
          cleanup_xvfb() {
            if kill -0 "$XVFB_PID" 2>/dev/null; then
              kill "$XVFB_PID"
            fi
          }
          trap cleanup_xvfb EXIT
          for attempt in $(seq 1 20); do
            if [ -S /tmp/.X11-unix/X100 ]; then break; fi
            sleep 0.25
          done
          test -S /tmp/.X11-unix/X100
          export DISPLAY=:100
          BUNDLE="build/linux/x64/release/bundle"
          REPO="$GITHUB_WORKSPACE/watchtower-extensions"
          # The CLI's own filters pick the subset, exactly like the app's
          # diagnostic screen; no ad-hoc index parsing here.
          "$BUNDLE/watchtower" --cli extensions list --repo "$REPO" \
            --type watch --lang fr --sfw --json \
            > "$GITHUB_WORKSPACE/watchtower-cli-fr-watch-selection.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("watchtower-cli-fr-watch-selection.json").read_text())
          sources = result["sources"]
          assert result["total"] == len(sources), "Selection count is inconsistent"
          assert all(s.get("type") == "watch" for s in sources), "Type filter leaked other kinds"
          assert all(s.get("lang") == "fr" for s in sources), "Language filter leaked other languages"
          selected = sorted(sources, key=lambda s: s["name"].casefold())[:5]
          if len(selected) != 5:
              raise SystemExit(f"Expected at least five French Watch entries, found {len(selected)}")

          fixture = Path("watchtower-cli-french-watch")
          (fixture / "index").mkdir(parents=True, exist_ok=True)
          (fixture / "index" / "watch.json").write_text(
              json.dumps(selected, ensure_ascii=False, indent=2) + "\n"
          )
          print("Testing: " + ", ".join(entry["name"] for entry in selected))
          PY
          ln -s "$GITHUB_WORKSPACE/watchtower-extensions/src" \
            "$GITHUB_WORKSPACE/watchtower-cli-french-watch/src"
          cli_status=0
          "$BUNDLE/watchtower" --cli extensions test \
            --repo "$GITHUB_WORKSPACE/watchtower-cli-french-watch" \
            --mode deep \
            --concurrency 4 \
            --timeout 45 \
            --report "$GITHUB_WORKSPACE/watchtower-cli-french-watch-report.json" \
            --json > "$GITHUB_WORKSPACE/watchtower-cli-french-watch-stdout.json" \
            2> "$GITHUB_WORKSPACE/watchtower-cli-french-watch.stderr.log" \
            || cli_status=$?
          cat "$GITHUB_WORKSPACE/watchtower-cli-french-watch.stderr.log" >&2
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("watchtower-cli-french-watch-report.json").read_text())
          stdout = json.loads(Path("watchtower-cli-french-watch-stdout.json").read_text())
          assert report == stdout, "CLI JSON stdout differs from its saved report"
          assert report.get("total") == 5, f"Expected five extensions, got {report.get('total')}"
          assert report.get("failed") == 0, f"{report.get('failed')} French Watch extension tests failed"
          print("All five French Watch extensions passed deep mode")
          PY
          if [ "$cli_status" -ne 0 ]; then
            echo "CLI extension test exited with status $cli_status" >&2
            exit "$cli_status"
          fi

      - name: Add installer to bundle
        if: always()
        run: |
          cp scripts/install-linux-headless.sh build/linux/x64/release/bundle/
          chmod +x build/linux/x64/release/bundle/install-linux-headless.sh

      - name: Package Linux headless archive
        if: always()
        run: |
          cd build/linux/x64/release/bundle
          7z a -t7z -mx=9 -mmt=2 \
            ../../../../../watchtower-linux-x64-headless.7z .
          cd -
          ls -lh watchtower-linux-x64-headless.7z

      - name: Upload Linux headless artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: watchtower-linux-x64-headless
          path: watchtower-linux-x64-headless.7z
          compression-level: 0
          retention-days: 30

      - name: Upload CLI validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: watchtower-cli-validation-reports
          path: |
            watchtower-cli-doctor.json
            watchtower-cli-doctor.stderr.log
            watchtower-cli-catalog.json
            watchtower-cli-catalog.stderr.log
            watchtower-filter-*.json
            watchtower-xvfb-verify.log
            watchtower-cli-fr-watch-selection.json
            watchtower-cli-french-watch-report.json
            watchtower-cli-french-watch-stdout.json
            watchtower-cli-french-watch.stderr.log
            watchtower-xvfb-test.log
          if-no-files-found: ignore
          retention-days: 14
