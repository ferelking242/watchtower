name: Build Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: windows-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: windows-pub-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Compute version
        id: ver
        shell: bash
        run: |
          VNAME=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')
          VCODE=${GITHUB_RUN_NUMBER}
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Building $VNAME ($VCODE)"

      - name: Build Windows x64
        run: >
          flutter build windows
          --release
          --no-tree-shake-icons
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}

      - name: Show build size
        shell: bash
        run: |
          BUILD_DIR="build/windows/x64/runner/Release"
          if [ -d "$BUILD_DIR" ]; then
            echo "Build size: $(du -sh "$BUILD_DIR" | cut -f1)"
            ls -la "$BUILD_DIR"
          fi

      - name: Create NSIS installer (LZMA solid ultra compression)
        shell: pwsh
        run: |
          $src    = "build\windows\x64\runner\Release"
          $ver    = "${{ steps.ver.outputs.name }}"
          $out    = "watchtower-setup-$ver.exe"
          $srcAbs = (Resolve-Path $src).Path

          $nsi = @"
          Unicode true
          !include "MUI2.nsh"

          ; ── Compression (must come before any File command) ──────────
          SetCompressor /SOLID lzma
          SetCompressorDictSize 64

          ; ── Installer metadata ───────────────────────────────────────
          Name "Watchtower $ver"
          OutFile "$out"
          InstallDir "`$PROGRAMFILES64\Watchtower"
          InstallDirRegKey HKLM "Software\Watchtower" "InstallDir"
          RequestExecutionLevel admin
          BrandingText "Watchtower $ver"

          ; ── MUI pages ────────────────────────────────────────────────
          !define MUI_WELCOMEPAGE_TITLE "Welcome to Watchtower $ver"
          !define MUI_FINISHPAGE_RUN    "`$INSTDIR\watchtower.exe"
          !define MUI_FINISHPAGE_RUN_TEXT "Launch Watchtower"
          !define MUI_ABORTWARNING

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"
          !insertmacro MUI_LANGUAGE "French"

          ; ── Install section ──────────────────────────────────────────
          Section "Watchtower" SecMain
            SetOutPath "`$INSTDIR"
            File /r "$srcAbs\*.*"

            ; Desktop shortcut
            CreateShortcut "`$DESKTOP\Watchtower.lnk" "`$INSTDIR\watchtower.exe"

            ; Start-menu shortcut
            CreateDirectory "`$SMPROGRAMS\Watchtower"
            CreateShortcut  "`$SMPROGRAMS\Watchtower\Watchtower.lnk"   "`$INSTDIR\watchtower.exe"
            CreateShortcut  "`$SMPROGRAMS\Watchtower\Uninstall.lnk"    "`$INSTDIR\uninstall.exe"

            ; Add/Remove Programs entry
            WriteUninstaller "`$INSTDIR\uninstall.exe"
            WriteRegStr  HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower" \
                              "DisplayName"      "Watchtower"
            WriteRegStr  HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower" \
                              "UninstallString"  "`$INSTDIR\uninstall.exe"
            WriteRegStr  HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower" \
                              "DisplayVersion"   "$ver"
            WriteRegStr  HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower" \
                              "Publisher"        "ferelking242"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower" \
                              "NoModify" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower" \
                              "NoRepair" 1
          SectionEnd

          ; ── Uninstall section ─────────────────────────────────────────
          Section "Uninstall"
            Delete "`$INSTDIR\uninstall.exe"
            RMDir  /r "`$INSTDIR"
            Delete "`$DESKTOP\Watchtower.lnk"
            RMDir  /r "`$SMPROGRAMS\Watchtower"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\Watchtower"
            DeleteRegKey HKLM "Software\Watchtower"
          SectionEnd
          "@

          $nsi | Out-File -FilePath "watchtower.nsi" -Encoding UTF8
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V3 watchtower.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sizeMB = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "✅ Installer: $out  ($sizeMB MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-windows-setup-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}
          path: watchtower-setup-${{ steps.ver.outputs.name }}.exe
          retention-days: 30
