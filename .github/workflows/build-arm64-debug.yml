name: Build Android ARMv8 Profile

on:
  push:
    branches: [ main, master, service-dart-fix ]
  pull_request:
    branches: [ main, master, service-dart-fix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ARMv8 Profile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Cache Gradle — evite de re-telecharger ~400 MB de deps a chaque build
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compute and bump version
        id: ver
        run: |
          MAJOR=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+)\..*/\1/')
          MINOR=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*[0-9]+\.([0-9]+)\..*/\1/')
          PATCH=${GITHUB_RUN_NUMBER}
          VNAME="${MAJOR}.${MINOR}.${PATCH}"
          VCODE=${GITHUB_RUN_NUMBER}
          TAG="v${VNAME}-b${VCODE}"
          sed -i "s/^version:.*/version: ${VNAME}+${VCODE}/" pubspec.yaml
          echo "name=${VNAME}"  >> "$GITHUB_OUTPUT"
          echo "code=${VCODE}"  >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "full=${VNAME}+${VCODE}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${VNAME}+${VCODE} (tag: ${TAG})"

      - name: Generate Mihon-style changelog
        id: changelog
        run: |
          python3 - << 'PYEOF'
          import subprocess, re, os
          prev_tag = subprocess.getoutput("git tag --sort=-creatordate 2>/dev/null | head -1").strip()
          if prev_tag:
            raw = subprocess.getoutput('git log --no-merges --pretty=format:"%s" "' + prev_tag + '..HEAD" 2>/dev/null')
          else:
            raw = subprocess.getoutput('git log --no-merges --pretty=format:"%s" -40 2>/dev/null')
          messages = [l.strip() for l in raw.strip().splitlines() if l.strip()]
          feat, changes, improvements, fixes, removals = [], [], [], [], []
          for msg in messages:
            m = re.match(r'^(feat|fix|chore|refactor|perf|i18n|docs|style|test|build|ci|revert)(\([^)]+\))?!?:\s*(.*)', msg, re.IGNORECASE)
            if m:
                typ = m.group(1).lower()
                desc = (m.group(3) or '').strip()
                label = '- ' + desc
                if typ == 'feat': feat.append(label)
                elif typ == 'fix': fixes.append(label)
                elif typ in ('chore','build','ci','style','test'): removals.append(label)
                elif typ in ('refactor','perf'): improvements.append(label)
                elif typ in ('i18n','docs'): changes.append(label)
                elif typ == 'revert': removals.append(label)
            else:
                lo = msg.lower()
                if any(w in lo for w in ['feat','add ','new ','impl','redesign']): feat.append('- ' + msg)
                elif any(w in lo for w in ['fix','bug','patch','repair','resolve']): fixes.append('- ' + msg)
                elif any(w in lo for w in ['remove','delete','deprecat','drop']): removals.append('- ' + msg)
                elif any(w in lo for w in ['improve','optim','perf','refactor']): improvements.append('- ' + msg)
                else: changes.append('- ' + msg)
          def dedup(lst):
            seen = set()
            return [x for x in lst if not (x in seen or seen.add(x))]
          feat = dedup(feat)[:20]
          changes = dedup(changes)[:15]
          improvements = dedup(improvements)[:15]
          fixes = dedup(fixes)[:20]
          removals = dedup(removals)[:10]
          sections = []
          if feat: sections.append('## \u2728 Nouvelles fonctionnalit\u00e9s\n' + '\n'.join(feat))
          if changes: sections.append('## \u2699\ufe0f Changements\n' + '\n'.join(changes))
          if improvements: sections.append('## \U0001f680 Am\u00e9liorations\n' + '\n'.join(improvements))
          if fixes: sections.append('## \U0001f9e9 Corrections\n' + '\n'.join(fixes))
          if removals: sections.append('## \U0001f9f9 Suppressions\n' + '\n'.join(removals))
          if not sections: sections = ['## \u2699\ufe0f Changements\n- Maintenance et corrections internes']
          footer = '\n\n---\n### \U0001f4f1 Installation Android\n1. T\u00e9l\u00e9chargez le fichier APK\n2. Ouvrez-le sur Android\n3. Activez \"Sources inconnues\" si demand\u00e9'
          body = '\n\n'.join(sections) + footer
          with open('/tmp/changelog.md', 'w') as f:
            f.write(body)
          print('Changelog OK')
          PYEOF
          echo "file=/tmp/changelog.md" >> "$GITHUB_OUTPUT"

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Free disk space
        run: |
            df -h
            # Remove large pre-installed packages not needed for Flutter builds
            sudo rm -rf /usr/local/lib/android/sdk/ndk/26* /usr/local/lib/android/sdk/ndk/29* || true
            sudo rm -rf /usr/local/lib/android/sdk/build-tools/34* /usr/local/lib/android/sdk/build-tools/35* || true
            sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell || true
            sudo apt-get clean -y || true
            docker image prune -af 2>/dev/null || true
            df -h
      - name: Setup Python runtime + ZeusDL package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            set -euo pipefail

            # ── 1. Runtime Python Bionic ARM64/x86_64 (youtubedl-android) ────────
            # libpython.so      (4 KB)  = interpréteur Python, execv depuis nativeLibsDir ✓
            # libpython.zip.so  (11 MB) = stdlib Python, décompressé dans filesDir au runtime
            BASE="https://raw.githubusercontent.com/JunkFood02/youtubedl-android/master/library/src/main/jniLibs"
            for ABI in arm64-v8a x86_64; do
              mkdir -p "android/app/src/main/jniLibs/${ABI}"
              for LIB in libpython.so libpython.zip.so; do
                echo "Téléchargement ${ABI}/${LIB}…"
                curl -fsSL "${BASE}/${ABI}/${LIB}" \
                  -o "android/app/src/main/jniLibs/${ABI}/${LIB}"
                echo "  → $(du -sh android/app/src/main/jniLibs/${ABI}/${LIB})"
              done
            done

              # ── 1b. libandroid-support.so depuis le NDK Android ─────────────────
              # ROOT CAUSE du crash : libpython3.11.so dépend de libandroid-support.so
              # pour des fonctions POSIX manquantes sur Android sans Termux.
              # NDK : sources/cxx-stl/llvm-libc++/libs/<ABI>/libandroid-support.so
              for ABI in arm64-v8a x86_64; do
                SUPPORT_SO=$(find \
                  "${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk}" \
                  -name "libandroid-support.so" -path "*${ABI}*" 2>/dev/null \
                  | head -1)
                if [ -n "$SUPPORT_SO" ]; then
                  cp "$SUPPORT_SO" "android/app/src/main/jniLibs/${ABI}/libandroid-support.so"
                  echo "  ✅ libandroid-support.so (NDK) → ${ABI}"
                else
                  echo "  ⚠️  libandroid-support.so introuvable NDK/${ABI} — le step Extract l'extraira du zip"
                fi
              done

              # ── 2. Package ZeusDL Python ──────────────────────────────────────────
            RELEASE=$(curl -fsSL \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/ferelking242/zeusdl/releases/latest")
            TAG=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
            echo "ZeusDL tag: $TAG"

            mkdir -p assets/zeusdl
            curl -fsSL \
              "https://github.com/ferelking242/zeusdl/releases/download/${TAG}/zeusdl.zip" \
              -o assets/zeusdl/zeusdl.zip
            echo "$TAG" > assets/zeusdl/version.txt
            echo "zeusdl.zip original : $(du -sh assets/zeusdl/zeusdl.zip)"

            # ── 3. Vendoring des dépendances pure-Python dans zeusdl.zip ────────
            # Les packages pure-Python ne nécessitent pas de compilation C.
            # Ils sont extraits dans le même répertoire que __main__.py, donc
            # Python les trouve automatiquement via sys.path (répertoire du script).
            echo "Vendoring dépendances pure-Python dans zeusdl.zip..."

            VENDOR_DIR="$(mktemp -d)"
            pip3 install \
              requests \
              certifi \
              urllib3 \
              charset-normalizer \
              idna \
              websockets \
              mutagen \
              --target "$VENDOR_DIR" \
              --no-compile \
              -q 2>&1 | tail -5

            # Supprimer .dist-info et __pycache__ (pas nécessaires au runtime)
            find "$VENDOR_DIR" -name "*.dist-info" -type d -exec rm -rf {} + 2>/dev/null || true
            find "$VENDOR_DIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            find "$VENDOR_DIR" -name "*.pth" -delete 2>/dev/null || true
            echo "Vendor dir: $(du -sh $VENDOR_DIR)"

            # Décompresser zeusdl.zip, ajouter les vendored packages, recompresser
            ZEUS_UNPACK="$(mktemp -d)"
            unzip -q assets/zeusdl/zeusdl.zip -d "$ZEUS_UNPACK"

            # Copier les packages vendored (sans écraser le code ZeusDL)
            cp -rn "$VENDOR_DIR/." "$ZEUS_UNPACK/" 2>/dev/null || cp -r "$VENDOR_DIR/." "$ZEUS_UNPACK/"

            # Recompresser
            cd "$ZEUS_UNPACK" && zip -qr /tmp/zeusdl_bundled.zip . && cd -
            mv /tmp/zeusdl_bundled.zip assets/zeusdl/zeusdl.zip
            rm -rf "$VENDOR_DIR" "$ZEUS_UNPACK"

            echo "zeusdl.zip avec dépendances : $(du -sh assets/zeusdl/zeusdl.zip)"

            # Nettoyer anciens assets obsolètes
            rm -rf assets/certifi assets/binaries

            echo "=== Setup terminé ==="
            echo "jniLibs arm64-v8a:"
            ls -lh android/app/src/main/jniLibs/arm64-v8a/
            echo "assets/zeusdl:"
            ls -lh assets/zeusdl/

      - name: Extract Python runtime libs from zip + fix libpython.so deps
        run: |
          # ROOT CAUSE: Gradle ignores files not ending in ".so".
          # libpython3.11.so.1.0 (ends in .so.1.0) is silently dropped from the APK.
          # FIX: extract it renamed as libpython3.11.so + patchelf replace-needed.
          # Chain: libpython.so -> libpython3.11.so -> libandroid-support.so -> libc.so
          set -euo pipefail
          sudo apt-get install -y patchelf p7zip-full --quiet 2>/dev/null

          # Write node extraction script (all lines indented = uniform YAML stripping)
          node - << 'NODEEOF'
          const fs = require('fs');
          const src = `
          const fs2 = require('fs'), zlib = require('zlib');
          const [,, zip, entry, out] = process.argv;
          const buf = fs2.readFileSync(zip);
          let eocd = -1;
          for (let i = buf.length-22; i >= Math.max(0,buf.length-65558); i--) {
            if (buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){eocd=i;break;}
          }
          const cdOff=buf.readUInt32LE(eocd+16), cdSz=buf.readUInt32LE(eocd+12);
          let pos=cdOff, found=false;
          while (pos<cdOff+cdSz) {
            if (buf.readUInt32LE(pos)!==0x02014b50) break;
            const fnLen=buf.readUInt16LE(pos+28), name=buf.slice(pos+46,pos+46+fnLen).toString();
            const lOff=buf.readUInt32LE(pos+42);
            pos+=46+fnLen+buf.readUInt16LE(pos+30)+buf.readUInt16LE(pos+32);
            if (name!==entry) continue;
            found=true;
            const dOff=lOff+30+buf.readUInt16LE(lOff+26)+buf.readUInt16LE(lOff+28);
            const m=buf.readUInt16LE(lOff+8), csz=buf.readUInt32LE(lOff+18);
            let data=buf.slice(dOff,dOff+csz);
            if (m===8) data=zlib.inflateRawSync(data);
            fs2.writeFileSync(out,data);
            console.log('OK '+entry+' ('+data.length+'B) -> '+out);
            break;
          }
          if (!found){console.error('NOT FOUND: '+entry);process.exit(1);}
          `.trim().replace(/^ {10}/gm,'');
          fs.writeFileSync('/tmp/xzip.js', src);
          console.log('xzip.js written');
          NODEEOF

          for ABI in arm64-v8a x86_64; do
            JNIDIR="android/app/src/main/jniLibs/${ABI}"
            ZIP="${JNIDIR}/libpython.zip.so"
            LAUNCHER="${JNIDIR}/libpython.so"
            [ -f "$ZIP" ] || { echo "SKIP ${ABI}: zip absent"; continue; }
            echo "=== ${ABI} ==="

            # 1. Python interpreter (5MB) renamed to .so so Gradle includes it
            node /tmp/xzip.js "$ZIP" "usr/lib/libpython3.11.so.1.0" "${JNIDIR}/libpython3.11.so"
            readelf -d "${JNIDIR}/libpython3.11.so" | grep -E 'SONAME|NEEDED'

            # 2. libandroid-support (dependency of libpython3.11.so, ends in .so = OK)
            node /tmp/xzip.js "$ZIP" "usr/lib/libandroid-support.so" "${JNIDIR}/libandroid-support.so"
            readelf -d "${JNIDIR}/libandroid-support.so" | grep NEEDED

            # 2b. libffi.so (real content 85KB, not a symlink — needed by ctypes/cffi C extensions)
            #     In nativeLibraryDir → Android linker namespace finds it via dlopen() automatiquement
            node /tmp/xzip.js "$ZIP" "usr/lib/libffi.so" "${JNIDIR}/libffi.so"
            echo "  libffi.so: $(du -sh ${JNIDIR}/libffi.so)"

            # 3. Fix libpython3.11.so: replace Termux RUNPATH with $ORIGIN
            #    REAL ROOT CAUSE: RUNPATH=/data/data/com.termux/... hardcoded at compile time
            #    $ORIGIN = "same directory as this .so" = /data/app/.../lib/arm64/
            echo "libpython3.11.so before:"
            readelf -d "${JNIDIR}/libpython3.11.so" | grep -E 'NEEDED|RUNPATH'
            patchelf --set-rpath '$ORIGIN' "${JNIDIR}/libpython3.11.so"
            echo "libpython3.11.so after:"
            readelf -d "${JNIDIR}/libpython3.11.so" | grep -E 'NEEDED|RUNPATH'

            # 4. Patch libpython.so: fix NEEDED name + replace Termux RUNPATH with $ORIGIN
            echo "libpython.so before:"
            readelf -d "$LAUNCHER" | grep -E 'NEEDED|RUNPATH'
            patchelf --replace-needed libpython3.11.so.1.0 libpython3.11.so "$LAUNCHER"
            patchelf --remove-needed libandroid-support.so "$LAUNCHER"
            patchelf --set-rpath '$ORIGIN' "$LAUNCHER"
            echo "libpython.so after:"
            readelf -d "$LAUNCHER" | grep -E 'NEEDED|RUNPATH'
          done

          echo "=== arm64-v8a jniLibs ==="
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          echo "=== x86_64 jniLibs ==="
          ls -lh android/app/src/main/jniLibs/x86_64/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons (flutter_launcher_icons)
        run: dart run flutter_launcher_icons

      - name: Build APK (ARMv8 profile)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dhttp.keepAlive=false -Dmaven.wagon.http.retryHandler.count=3"
        run: |
          for attempt in 1 2 3; do
            echo "--- Build attempt $attempt/3 ---"
            if flutter build apk \
              --profile \
              --target-platform android-arm64 \
              --split-per-abi \
              --no-tree-shake-icons \
              --build-name=${{ steps.ver.outputs.name }} \
              --build-number=${{ steps.ver.outputs.code }}; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Build failed, waiting 45s..."
              sleep 45
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done

      - name: Rename APK (for GitHub Release — raw APK stays installable)
        run: |
          SRC=build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk
          DST=build/app/outputs/flutter-apk/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
          cp "$SRC" "$DST"
          echo "APK: $(du -sh $DST | cut -f1)"

      - name: FitGirl-style artifact — LZMA2 ultra compressed APK
        run: |
          APK=build/app/outputs/flutter-apk/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
          echo "APK size: $(du -sh $APK)"
          # Compress the APK file directly (not the extracted contents).
          # .so libs are STORED uncompressed in the APK → LZMA2 ultra compresses them 40-60%.
          # Download: .zip(.7z(APK)) — unzip → .7z → extract → installable APK.
          7z a -t7z -mx=9 -mmt=2 -mfb=128 -md=64m -ms=on \
            Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.7z \
            "$APK"
          echo "=== Compressed artifact ==="
          ls -lh Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.7z

      - name: Upload raw APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64-raw
          path: build/app/outputs/flutter-apk/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
          compression-level: 0
          retention-days: 30

      - name: Upload 7z compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64-7z
          path: Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.7z
          compression-level: 0
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Watchtower ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})"
          body_path: ${{ steps.changelog.outputs.file }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
