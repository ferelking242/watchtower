name: Build Android ARMv8 Profile

on:
  push:
    branches: [ main, master, service-dart-fix ]
  pull_request:
    branches: [ main, master, service-dart-fix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ARMv8 Profile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Compute and bump version
        id: ver
        run: |
          MAJOR=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+)\..*/\1/')
          MINOR=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*[0-9]+\.([0-9]+)\..*/\1/')
          PATCH=${GITHUB_RUN_NUMBER}
          VNAME="${MAJOR}.${MINOR}.${PATCH}"
          VCODE=${GITHUB_RUN_NUMBER}
          TAG="v${VNAME}-b${VCODE}"
          # Bump pubspec.yaml so the built APK reports the new version
          sed -i "s/^version:.*/version: ${VNAME}+${VCODE}/" pubspec.yaml
          echo "name=${VNAME}"  >> "$GITHUB_OUTPUT"
          echo "code=${VCODE}"  >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "full=${VNAME}+${VCODE}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${VNAME}+${VCODE} (tag: ${TAG})"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate 2>/dev/null | head -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline -20 --no-merges 2>/dev/null || echo "Initial release")
          else
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD" --no-merges 2>/dev/null || git log --oneline -20 --no-merges)
          fi
          cat > /tmp/changelog.md << 'CHANGELOG_EOF'
          ## 🚀 Watchtower ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

          ### 📝 Changements récents
          CHANGELOG_EOF
          echo '```' >> /tmp/changelog.md
          echo "$COMMITS" >> /tmp/changelog.md
          echo '```' >> /tmp/changelog.md
          cat >> /tmp/changelog.md << 'FOOTER_EOF'

          ### 📱 Installation Android
          1. Téléchargez le fichier APK ci-dessous
          2. Ouvrez-le sur votre appareil Android
          3. Activez **"Sources inconnues"** si demandé

          > ⚠️ Cette build est en mode **Profile** (optimisée, avec outils de debug légers).
          FOOTER_EOF
          echo "file=/tmp/changelog.md" >> "$GITHUB_OUTPUT"

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (ARMv8 profile)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.keepAlive=false -Dmaven.wagon.http.retryHandler.count=3"
        run: |
          for attempt in 1 2 3; do
            echo "--- Build attempt $attempt/3 ---"
            if flutter build apk \
              --profile \
              --target-platform android-arm64 \
              --split-per-abi \
              --no-tree-shake-icons \
              --build-name=${{ steps.ver.outputs.name }} \
              --build-number=${{ steps.ver.outputs.code }}; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Build failed, waiting 45s..."
              sleep 45
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done

      - name: Rename APK
        run: |
          SRC=build/app/outputs/apk/profile/app-arm64-v8a-profile.apk
          DST=build/app/outputs/apk/profile/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
          cp "$SRC" "$DST"
          echo "APK: $(du -sh $DST | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64
          path: build/app/outputs/apk/profile/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Watchtower ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})"
          body_path: ${{ steps.changelog.outputs.file }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/apk/profile/Watchtower-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
