name: Watchtower CLI and download contract tests

on:
  push:
    paths:
      - 'lib/cli/**'
      - 'test/watchtower_cli_options_test.dart'
      - 'test/watchtower_cli_catalog_test.dart'
      - 'test/watchtower_cli_plugins_test.dart'
      - 'test/watchtower_cli_safety_test.dart'
      - 'lib/modules/browse/plugins_section.dart'
      - 'lib/modules/manga/download/providers/download_provider.dart'
      - 'lib/modules/more/download_queue/**'
      - 'lib/services/download_manager/download_isolate_pool.dart'
      - 'lib/services/update_notification_service.dart'
      - 'test/download_queue_grouping_test.dart'
      - 'test/image_download_response_test.dart'
      - 'lib/modules/watch/home/extension_home_empty_state.dart'
      - 'lib/modules/watch/home/watch_extension_home_screen.dart'
      - 'lib/modules/media/content_cards.dart'
      - 'test/extension_home_empty_state_test.dart'
      - 'test/content_image_placeholder_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/test-cli-contract.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lib/cli/**'
      - 'test/watchtower_cli_options_test.dart'
      - 'test/watchtower_cli_catalog_test.dart'
      - 'test/watchtower_cli_plugins_test.dart'
      - 'test/watchtower_cli_safety_test.dart'
      - 'lib/modules/browse/plugins_section.dart'
      - 'lib/modules/manga/download/providers/download_provider.dart'
      - 'lib/modules/more/download_queue/**'
      - 'lib/services/download_manager/download_isolate_pool.dart'
      - 'lib/services/update_notification_service.dart'
      - 'test/download_queue_grouping_test.dart'
      - 'test/image_download_response_test.dart'
      - 'lib/modules/watch/home/extension_home_empty_state.dart'
      - 'lib/modules/watch/home/watch_extension_home_screen.dart'
      - 'lib/modules/media/content_cards.dart'
      - 'test/extension_home_empty_state_test.dart'
      - 'test/content_image_placeholder_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/test-cli-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-contract:
    name: Contract tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Test CLI argument contract
        run: flutter test test/watchtower_cli_options_test.dart test/watchtower_cli_catalog_test.dart test/watchtower_cli_plugins_test.dart test/watchtower_cli_safety_test.dart

      - name: Test download queue and image response contracts
        run: flutter test test/download_queue_grouping_test.dart test/image_download_response_test.dart

      - name: Test Watch empty-state and image placeholder UI
        run: flutter test test/extension_home_empty_state_test.dart test/content_image_placeholder_test.dart

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/cli/watchtower_cli.dart lib/cli/watchtower_cli_options.dart lib/cli/watchtower_cli_catalog.dart lib/cli/watchtower_cli_plugins.dart lib/cli/watchtower_cli_safety.dart lib/modules/more/download_queue/download_queue_grouping.dart test/watchtower_cli_options_test.dart test/watchtower_cli_catalog_test.dart test/watchtower_cli_plugins_test.dart test/watchtower_cli_safety_test.dart test/download_queue_grouping_test.dart test/image_download_response_test.dart

      - name: Analyze CLI code and tests
        run: flutter analyze --no-pub lib/cli/watchtower_cli.dart lib/cli/watchtower_cli_options.dart lib/cli/watchtower_cli_catalog.dart lib/cli/watchtower_cli_plugins.dart lib/cli/watchtower_cli_safety.dart lib/modules/more/download_queue/download_queue_grouping.dart test/watchtower_cli_options_test.dart test/watchtower_cli_catalog_test.dart test/watchtower_cli_plugins_test.dart test/watchtower_cli_safety_test.dart test/download_queue_grouping_test.dart test/image_download_response_test.dart
