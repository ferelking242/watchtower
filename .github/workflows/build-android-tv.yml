name: Build Android TV APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv:
    name: Build Android TV (Leanback) APK
    runs-on: ubuntu-latest
    # Two sequential Gradle builds (one per TV ABI) plus cold Rust compiles
    # can take well over 20 minutes.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tv-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock', 'android/gradle.properties') }}
          restore-keys: |
            gradle-tv-${{ runner.os }}-
            gradle-release-${{ runner.os }}-

      - name: Cache Rust (Android TV ABIs)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust_builder/target
          key: rust-android-tv-release-${{ runner.os }}-${{ hashFiles('rust/**/*.rs', 'rust_builder/**/*.rs', '**/Cargo.lock', '**/Cargo.toml', '**/pubspec.lock') }}
          restore-keys: |
            rust-android-tv-release-${{ runner.os }}-
            rust-android-arm64-release-${{ runner.os }}-

      # Pre-install both targets serially: cargokit runs `rustup target add`
      # once per ABI and parallel invocations race on the rustup downloads
      # directory, which intermittently fails the Gradle build.
      - name: Pre-install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          rustup target list --installed | grep linux-android

      - name: Get packages
        run: flutter pub get

      # The manifest must keep both entries: without LEANBACK_LAUNCHER the
      # APK never shows up on the Android TV home screen, and without the
      # optional leanback/touchscreen features it would not install at all.
      - name: Verify Leanback launcher is declared
        run: |
          grep -q "LEANBACK_LAUNCHER" android/app/src/main/AndroidManifest.xml
          grep -q "android.software.leanback" android/app/src/main/AndroidManifest.xml
          grep -q "android.hardware.touchscreen\" android:required=\"false\"" android/app/src/main/AndroidManifest.xml

      # Release builds are signed with the stable keystore stored in the
      # KEYSTORE_B64 secret (same convention as build-release.yml).
      - name: Decode keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/watchtower-debug.keystore
          echo "Keystore size: $(wc -c < android/app/watchtower-debug.keystore) bytes"

      # The app's build.gradle keeps splits.abi disabled and picks the native
      # ABIs with the watchtowerCiAbi gradle property, so --split-per-abi can
      # never produce per-ABI APKs. Build one self-contained APK per TV ABI
      # instead (ORG_GRADLE_PROJECT_* exports the Gradle project property).
      - name: Build TV APK (arm64-v8a)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dmaven.wagon.http.retryHandler.count=3"
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }} \
            --tree-shake-icons
          mkdir -p build/tv
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/tv/watchtower-tv-arm64.apk

      - name: Build TV APK (x86_64)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dmaven.wagon.http.retryHandler.count=3"
          ORG_GRADLE_PROJECT_watchtowerCiAbi: x86_64
        run: |
          rm -f build/app/outputs/flutter-apk/app-release.apk
          flutter build apk \
            --release \
            --target-platform android-x64 \
            --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }} \
            --tree-shake-icons
          test -f build/app/outputs/flutter-apk/app-release.apk \
            || { echo 'x86_64 APK was not produced'; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/tv/watchtower-tv-x86_64.apk

      - name: Verify TV APKs
        run: |
          ls -lh build/tv
          for apk in build/tv/*.apk; do
            echo "=== $apk ==="
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
          done

      - name: Upload TV APKs
        uses: actions/upload-artifact@v5
        with:
          name: watchtower-android-tv
          path: build/tv/*.apk
          if-no-files-found: error
          retention-days: 14
