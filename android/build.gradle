allprojects {
    repositories {
        google()
        // JetBrains CDN proxy for Maven Central — avoids 403 on GitHub Actions IPs
        // (only proxies Maven Central artifacts, Flutter artifacts still come from google())
        maven { url "https://cache-redirector.jetbrains.com/maven-central" }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
    if (project.plugins.hasPlugin("com.android.application") ||
      project.plugins.hasPlugin("com.android.library")) {
      project.android {
        compileSdkVersion 36
        buildToolsVersion "34.0.0"
        // Force Java 17 on every subproject so it matches the Kotlin jvmTarget=17
        // set by the Kotlin Gradle Plugin when Java 17 is the active JDK.
        // Without this, plugins like flutter_avif_android default their
        // compileXxxJavaWithJavac to JVM 11, causing the
        // "Inconsistent JVM-target compatibility" Gradle error.
        compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
      // KotlinCompile tasks must also be pinned explicitly — android.kotlinOptions
      // is only available when the kotlin-android plugin is applied to *this*
      // project, so we use the task-level API which is always safe.
      project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
          jvmTarget = "17"
          // flutter_avif_android 3.1.0 declares FlutterAvifPlugin in BOTH
          // FlutterAvifPlugin.kt and FlutterAvifPlugin.java (upstream bug).
          // K2 (Kotlin 2.x) treats this as a hard "Redeclaration" error.
          // Forcing languageVersion=1.9 on this module only puts the K2 compiler
          // into K1-compat mode: the duplicate Java+Kotlin class is tolerated,
          // but the compiler can still read K2/2.x metadata from other libraries
          // (e.g. device_info_plus 12.3.0 compiled with Kotlin 2.2.0).
          // This is the correct fix — not downgrading the global Kotlin version.
          if (project.name == "flutter_avif_android") {
            languageVersion = "1.9"
            apiVersion = "1.9"
          }
        }
      }
      // The app module builds a "profile" buildType with matchingFallbacks=['release'].
      // matchingFallbacks only kicks in when Gradle's variant-aware dependency resolution
      // can't find an exact "profile" match — but with this many plugin subprojects the
      // fallback resolves inconsistently: some plugins (app_links observed in practice)
      // end up compiled against the wrong/no variant, so GeneratedPluginRegistrant calls
      // "new AppLinksPlugin()" against a class that was never actually packaged — R8 sees
      // it as reachable and "keeps" it, but there is nothing to keep (NoClassDefFoundError
      // at runtime, not a build error, because missing-class warnings are suppressed).
      // Giving every plugin library module a REAL "profile" buildType (identical to
      // release) removes the ambiguity entirely instead of depending on fallback matching.
      if (project.plugins.hasPlugin("com.android.library") && !project.name.equals("app")) {
        project.android {
          buildTypes {
            if (buildTypes.findByName("profile") == null) {
              profile {
                initWith(buildTypes.release)
              }
            }
          }
        }
      }
    }
    if (project.hasProperty("android")) {
      project.android {
        if (namespace == null) {
          namespace project.group
        }
      }
    }
  }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
