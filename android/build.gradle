allprojects {
    repositories {
        google()
        // JetBrains CDN proxy — avoids 403/rate-limit on GitHub Actions for kotlin-stdlib
        maven { url "https://cache-redirector.jetbrains.com/maven-central" }
        mavenCentral()
        maven { url "https://maven.pkg.jetbrains.space/public/p/kotlin/bootstrap" }
    }
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            // If any dep pulls kotlin-stdlib 2.0.21 (which 403s on Maven Central),
            // redirect to 2.0.20 which is reliably available everywhere.
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.version == '2.0.21') {
                details.useVersion '2.0.20'
                details.because 'kotlin-stdlib 2.0.21 returns 403 from Maven Central in GitHub Actions'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
    if (project.plugins.hasPlugin("com.android.application") ||
      project.plugins.hasPlugin("com.android.library")) {
      project.android {
        compileSdkVersion 36
        buildToolsVersion "34.0.0"
      }
    }
    if (project.hasProperty("android")) {
      project.android {
        if (namespace == null) {
          namespace project.group
        }
      }
    }
  }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
